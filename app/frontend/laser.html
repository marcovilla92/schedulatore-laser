<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stazione Laser - Schedulatore Laser</title>
    <link rel="stylesheet" href="/design.css">
    <style>
        /* Tinta ambient rosso laser (sovrascrive body::before di design.css) */
        body::before {
            background:
                radial-gradient(circle at 20% 50%, rgba(255, 71, 87, 0.04) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(168, 85, 247, 0.03) 0%, transparent 50%),
                radial-gradient(circle at 50% 80%, rgba(255, 71, 87, 0.02) 0%, transparent 50%);
        }

        /* ===== NAVBAR SEARCH ===== */
        .nav-search { margin-left: auto; display: flex; align-items: center; }
        .nav-search input {
            background: var(--bg-input); border: 1px solid var(--border-glass);
            border-radius: var(--radius-sm); color: var(--text-primary);
            font-size: 13px; padding: 7px 14px; width: 200px; height: 36px;
            transition: var(--transition);
        }
        .nav-search input:focus {
            outline: none; border-color: color-mix(in srgb, var(--page-accent) 40%, transparent);
            background: rgba(255, 255, 255, 0.08); width: 260px;
        }
        .nav-search input::placeholder { color: var(--text-muted); }

        /* ===== NAV TOUCH TARGET ===== */
        nav a { min-height: 40px; display: flex; align-items: center; }

        /* ===== FILTER CHIPS ===== */
        .filter-chips { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
        .chip {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 8px 16px; border-radius: 20px;
            border: 1px solid var(--border-glass);
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-secondary); font-size: 13px; font-weight: 600;
            cursor: pointer; transition: var(--transition); min-height: 36px;
        }
        .chip.active {
            background: color-mix(in srgb, var(--page-accent) 15%, transparent);
            border-color: color-mix(in srgb, var(--page-accent) 40%, transparent);
            color: var(--page-accent);
        }
        .chip-count {
            background: rgba(255, 255, 255, 0.1); border-radius: 10px;
            padding: 1px 6px; font-size: 11px;
        }
        .chip.active .chip-count {
            background: color-mix(in srgb, var(--page-accent) 20%, transparent);
        }

        /* ===== PAGE HEADER ===== */
        .page-header {
            margin-bottom: 32px;
            animation: fadeInUp 0.6s ease both;
        }

        .page-header h2 {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, var(--accent-red), #ff6b81);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        .page-header p {
            color: var(--text-secondary);
            font-size: 14px;
        }

        /* ===== SUMMARY BOX ===== */
        .summary-box {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 32px;
            animation: fadeInUp 0.6s ease both;
            animation-delay: 0.1s;
        }

        .summary-item {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-md);
            padding: 24px;
            text-align: center;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .summary-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--page-accent), transparent);
            opacity: 0.6;
        }

        .summary-item:hover {
            background: var(--bg-card-hover);
            border-color: color-mix(in srgb, var(--page-accent) 20%, transparent);
            box-shadow: 0 0 30px color-mix(in srgb, var(--page-accent) 5%, transparent);
        }

        .summary-number {
            font-size: 36px;
            font-weight: 800;
            color: var(--page-accent);
            letter-spacing: -1px;
            line-height: 1;
            margin-bottom: 8px;
        }

        .summary-label {
            font-size: 11px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 600;
        }

        /* ===== ORDERS GRID ===== */
        .orders-grid {
            display: grid;
            gap: 20px;
            animation: fadeInUp 0.6s ease both;
            animation-delay: 0.2s;
        }

        /* ===== ORDER CARD ===== */
        .order-card {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-lg);
            padding: 24px;
            transition: var(--transition);
            border-top: 2px solid color-mix(in srgb, var(--page-accent) 50%, transparent);
            position: relative;
            animation: fadeInUp 0.5s ease both;
        }

        .order-card:hover {
            background: var(--bg-card-hover);
            border-color: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 40px color-mix(in srgb, var(--page-accent) 8%, transparent), 0 8px 32px rgba(0, 0, 0, 0.3);
            transform: translateY(-2px);
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
        }

        .order-card h3 {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.3px;
        }

        .order-id {
            font-size: 11px;
            color: var(--text-muted);
            background: rgba(255, 255, 255, 0.05);
            padding: 3px 8px;
            border-radius: 6px;
            font-family: 'SF Mono', 'Fira Code', monospace;
            border: 1px solid var(--border-glass);
        }

        .order-info {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 12px;
        }

        .info-strong {
            color: var(--text-primary);
            font-weight: 600;
        }

        /* ===== ARTICLES SECTION ===== */
        .articles-section {
            margin: 16px 0;
            padding: 16px;
            background: color-mix(in srgb, var(--page-accent) 3%, transparent);
            border: 1px solid color-mix(in srgb, var(--page-accent) 8%, transparent);
            border-radius: var(--radius-sm);
        }

        .articles-section h4 {
            color: var(--page-accent);
            font-size: 11px;
            font-weight: 700;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .articles-section h4::before {
            content: '';
            width: 3px;
            height: 12px;
            background: var(--page-accent);
            border-radius: 2px;
            box-shadow: 0 0 8px var(--page-accent);
        }

        .article-item {
            font-size: 13px;
            color: var(--text-primary);
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .article-item:last-child {
            border-bottom: none;
        }

        .article-name {
            font-weight: 600;
            color: var(--text-primary);
        }

        .article-qty {
            font-size: 12px;
            color: var(--text-secondary);
        }

        /* ===== STATUS BADGE ===== */
        .status-badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            margin-top: 8px;
            letter-spacing: 0.3px;
        }

        .status-ready {
            background: color-mix(in srgb, var(--page-accent) 10%, transparent);
            color: var(--page-accent);
            border: 1px solid color-mix(in srgb, var(--page-accent) 20%, transparent);
        }

        .status-started {
            background: rgba(0, 212, 255, 0.1);
            color: var(--accent-cyan);
            border: 1px solid rgba(0, 212, 255, 0.2);
        }

        /* ===== STATI ARTICOLO PER-FASE ===== */
        .article-status-attesa {
            color: var(--text-secondary);
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .article-status-lavorazione {
            color: var(--accent-cyan);
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .article-status-lavorazione::before {
            content: '';
            display: inline-block;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--accent-cyan);
            box-shadow: 0 0 6px var(--accent-cyan);
            animation: pulse-dot 1.5s ease-in-out infinite;
            flex-shrink: 0;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.7); }
        }

        .article-status-completato {
            color: var(--accent-green);
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            opacity: 0.5;
        }

        /* Articolo completato nella fase: dimmed */
        .article-item.completato {
            opacity: 0.45;
        }

        /* ===== ACTION BUTTONS ===== */
        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }

        /* Touch targets WCAG 48/56px */
        .btn-avvia {
            flex: 1;
            background: linear-gradient(135deg, var(--accent-amber), #e69500);
            color: #000;
            border: none;
            padding: 14px 20px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 13px;
            font-weight: 700;
            font-family: inherit;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
            min-height: 56px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn-avvia:hover {
            box-shadow: 0 0 25px rgba(255, 165, 2, 0.3), 0 4px 15px rgba(0, 0, 0, 0.3);
            transform: translateY(-1px);
        }

        .btn-avvia:active {
            transform: translateY(0);
        }

        .btn-avvia:disabled {
            background: var(--text-muted);
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
            color: rgba(255, 255, 255, 0.3);
        }

        .btn-complete {
            flex: 1;
            background: linear-gradient(135deg, var(--accent-green), #00c853);
            color: #000;
            border: none;
            padding: 14px 20px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 13px;
            font-weight: 700;
            font-family: inherit;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
            min-height: 56px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn-complete:hover {
            box-shadow: 0 0 25px rgba(0, 230, 118, 0.3), 0 4px 15px rgba(0, 0, 0, 0.3);
            transform: translateY(-1px);
        }

        .btn-complete:active {
            transform: translateY(0);
        }

        .btn-complete:disabled {
            background: var(--text-muted);
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
            color: rgba(255, 255, 255, 0.3);
        }

        /* ===== EMPTY STATE ===== */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 80px 20px;
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-lg);
            animation: fadeInUp 0.6s ease both;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .empty-state h3 {
            color: var(--text-primary);
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .empty-state p {
            color: var(--text-secondary);
            font-size: 14px;
        }

        /* ===== MODAL ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0; top: 0;
            width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .modal-overlay.show {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: rgba(17, 24, 39, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-lg);
            padding: 32px;
            width: 90%;
            max-width: 520px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5), 0 0 80px color-mix(in srgb, var(--page-accent) 5%, transparent);
            animation: fadeInUp 0.3s ease both;
            position: relative;
            overflow: hidden;
        }

        .modal-content::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--page-accent), transparent);
        }

        .modal-title {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -0.3px;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .modal-subtitle {
            color: var(--text-secondary);
            font-size: 13px;
            margin-bottom: 24px;
        }

        .modal-checkboxes {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-sm);
            padding: 8px;
            margin-bottom: 24px;
            max-height: 320px;
            overflow-y: auto;
        }

        .modal-checkbox-item {
            padding: 12px;
            margin-bottom: 6px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            gap: 12px;
            transition: var(--transition);
            cursor: pointer;
        }

        .modal-checkbox-item:last-child {
            margin-bottom: 0;
        }

        .modal-checkbox-item:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(255, 255, 255, 0.1);
        }

        .modal-checkbox-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--page-accent);
            cursor: pointer;
            flex-shrink: 0;
        }

        .modal-checkbox-item label {
            flex: 1;
            cursor: pointer;
            color: var(--text-primary);
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .modal-checkbox-item label .qty-tag {
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 400;
        }

        .modal-checkbox-item label .completed-tag {
            color: var(--accent-green);
            font-size: 11px;
            font-weight: 600;
            background: rgba(0, 230, 118, 0.1);
            padding: 2px 8px;
            border-radius: 4px;
            margin-left: auto;
        }

        .modal-checkbox-item.is-completed {
            opacity: 0.6;
        }

        .modal-checkbox-item.is-completed label {
            font-weight: 700;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
        }

        .btn-modal-cancel {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-secondary);
            border: 1px solid var(--border-glass);
            padding: 12px 20px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            font-family: inherit;
            transition: var(--transition);
            min-height: 48px;
        }

        .btn-modal-cancel:hover {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-primary);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .btn-modal-confirm {
            flex: 1;
            background: linear-gradient(135deg, var(--accent-green), #00c853);
            color: #000;
            border: none;
            padding: 12px 20px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 13px;
            font-weight: 700;
            font-family: inherit;
            transition: var(--transition);
            min-height: 48px;
        }

        .btn-modal-confirm:hover {
            box-shadow: 0 0 25px rgba(0, 230, 118, 0.3), 0 4px 15px rgba(0, 0, 0, 0.3);
            transform: translateY(-1px);
        }

        /* Badge "Seleziona Tutti" nel modale */
        .btn-modal-select-all {
            background: rgba(0, 212, 255, 0.1);
            color: var(--accent-cyan);
            border: 1px solid rgba(0, 212, 255, 0.2);
            padding: 6px 14px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            font-family: inherit;
            transition: var(--transition);
            margin-bottom: 12px;
            min-height: 48px;
        }

        .btn-modal-select-all:hover {
            background: rgba(0, 212, 255, 0.15);
            border-color: rgba(0, 212, 255, 0.3);
        }

        /* ===== RESPONSIVE 1024px ===== */
        @media (max-width: 1023px) {
            .orders-grid { grid-template-columns: 1fr; }
            .summary-box { grid-template-columns: repeat(2, 1fr); }
            .action-buttons { flex-direction: column; }
            .modal-buttons { flex-direction: column; }
            .modal-content { padding: 24px; width: 95%; }
        }

        @media (min-width: 1024px) {
            .orders-grid { grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); }
        }
    </style>
</head>
<body data-page="laser">
    <!-- Navbar -->
    <nav>
        <div class="nav-logo">Schedulatore Laser</div>
        <a href="ordini-estratti">Ordini Estratti</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="laser.html" class="active">Laser</a>
        <a href="piega.html">Piega</a>
        <a href="saldatura.html">Saldatura</a>
        <a href="archive.html">Archivio</a>
        <div class="nav-search">
            <input type="search" id="navSearch" placeholder="Cerca cliente..." autocomplete="off" oninput="onSearch(this.value)">
        </div>
    </nav>

    <main>
        <div class="page-header">
            <h2>Stazione LASER</h2>
            <p>Articoli in attesa di lavorazione al laser</p>
        </div>

        <div id="message" class="message"></div>

        <div class="summary-box">
            <div class="summary-item">
                <div class="summary-number" id="countOrders">0</div>
                <div class="summary-label">Ordini</div>
            </div>
            <div class="summary-item">
                <div class="summary-number" id="countArticles">0</div>
                <div class="summary-label">Articoli</div>
            </div>
            <div class="summary-item">
                <div class="summary-number" id="countPieces">0</div>
                <div class="summary-label">Pezzi Totali</div>
            </div>
        </div>

        <div class="filter-chips">
            <button class="chip active" onclick="setStatusFilter('all')" id="chip-all">
                Tutti <span class="chip-count" id="count-all">0</span>
            </button>
            <button class="chip" onclick="setStatusFilter('in_attesa')" id="chip-attesa">
                In Attesa <span class="chip-count" id="count-attesa">0</span>
            </button>
            <button class="chip" onclick="setStatusFilter('in_lavorazione')" id="chip-lavorazione">
                In Lavorazione <span class="chip-count" id="count-lavorazione">0</span>
            </button>
        </div>

        <div class="orders-grid" id="ordersContainer"></div>
    </main>

    <!-- MODALE COMPLETAMENTO PARZIALE -->
    <div id="partialCompleteModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-title">Completa Fase LASER</div>
            <p class="modal-subtitle">Seleziona gli articoli completati per questa fase:</p>

            <button class="btn-modal-select-all" onclick="selectAllModalCheckboxes()">
                Seleziona Tutti
            </button>

            <div id="articlesCheckboxes" class="modal-checkboxes">
                <!-- Checkbox articoli generati dinamicamente -->
            </div>

            <div class="modal-buttons">
                <button class="btn-modal-cancel" onclick="closePartialModal()">
                    Annulla
                </button>
                <button class="btn-modal-confirm" onclick="submitPartialComplete()">
                    Completa Selezionati
                </button>
            </div>
        </div>
    </div>

    <script src="/shared.js"></script>
    <script>
        // Usa URL relativo per funzionare su localhost e IP
        const API_URL = '/api';
        const PHASE = 'LASER';

        // Stato globale — preservati durante auto-refresh
        let allOrders = [];
        let searchQuery = '';
        let statusFilter = 'all';
        let lastDataHash = null;

        // Stato modale completamento parziale
        let currentOrderForCompletion = null;
        let currentOrderArticles = [];

        // Count-up animation
        function animateCountUp(el, target) {
            let current = 0;
            const step = Math.max(1, Math.ceil(target / 30));
            const timer = setInterval(() => {
                current += step;
                if (current >= target) { current = target; clearInterval(timer); }
                el.textContent = current;
            }, 30);
        }

        // ===== FETCH/RENDER SEPARATION =====

        async function loadOrders(forceRender) {
            try {
                const response = await fetch(`${API_URL}/phase/${PHASE}/orders`);
                const orders = await response.json();
                const orderList = Array.isArray(orders) ? orders : [];

                const { changed, newHash } = hasDataChanged(orderList, lastDataHash);
                if (!forceRender && !changed) return;
                lastDataHash = newHash;

                allOrders = orderList;
                applyFiltersAndRender();
            } catch (error) {
                console.error('Errore caricamento ordini:', error);
                showMessage('Errore connessione al server', 'error');
            }
        }

        // Applica ENTRAMBI i filtri (ricerca + stato) e aggiorna la UI
        function applyFiltersAndRender() {
            let filtered = filterOrders(allOrders, searchQuery);
            if (statusFilter !== 'all') {
                filtered = filtered.filter(order =>
                    (order.articles_in_phase || []).some(a => a.phase_status === statusFilter)
                );
            }
            updateChipCounts();
            renderOrders(filtered);
            updateSummary(filtered);
        }

        // ===== CHIP FILTRI =====

        function updateChipCounts() {
            const total = filterOrders(allOrders, searchQuery);
            const attesa = total.filter(o => (o.articles_in_phase || []).some(a => a.phase_status === 'in_attesa'));
            const lavorazione = total.filter(o => (o.articles_in_phase || []).some(a => a.phase_status === 'in_lavorazione'));
            document.getElementById('count-all').textContent = total.length;
            document.getElementById('count-attesa').textContent = attesa.length;
            document.getElementById('count-lavorazione').textContent = lavorazione.length;
        }

        function setStatusFilter(status) {
            statusFilter = status;
            document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
            const chipId = status === 'all' ? 'chip-all' : status === 'in_attesa' ? 'chip-attesa' : 'chip-lavorazione';
            document.getElementById(chipId).classList.add('active');
            applyFiltersAndRender();
        }

        // ===== RICERCA NAVBAR =====

        const debouncedSearch = debounce((q) => {
            searchQuery = q;
            applyFiltersAndRender();
        }, 300);

        function onSearch(value) {
            debouncedSearch(value);
        }

        // ===== RENDER =====

        // Restituisce il badge HTML per lo stato articolo
        function articleStatusBadge(status) {
            if (status === 'in_lavorazione') {
                return '<span class="article-status-lavorazione">In lavorazione</span>';
            } else if (status === 'completato') {
                return '<span class="article-status-completato">Completato</span>';
            } else {
                return '<span class="article-status-attesa">In attesa</span>';
            }
        }

        function renderOrders(orders) {
            const container = document.getElementById('ordersContainer');

            // Filtra ordini che abbiano almeno un articolo non completato
            const activeOrders = orders.filter(order =>
                (order.articles_in_phase || []).some(a => a.phase_status !== 'completato')
            );

            if (activeOrders.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">&#x2714;</div>
                        <h3>Nessun Lavoro</h3>
                        <p>Non ci sono articoli in attesa per questa fase</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = activeOrders.map(order => {
                const articles = order.articles_in_phase || [];

                const articlesHtml = articles.map(article => {
                    const isCompletato = article.phase_status === 'completato';
                    const itemClass = isCompletato ? ' completato' : '';
                    return `
                        <div class="article-item${itemClass}">
                            <span>
                                <span class="article-name">${escapeHtml(article.name)}</span>
                                <span class="article-qty"> — ${article.code ? article.code + ' · ' : ''}${article.qty} pz</span>
                            </span>
                            ${articleStatusBadge(article.phase_status)}
                        </div>
                    `;
                }).join('');

                // Conteggi escludendo i completati (per riepilogo card)
                const pendingArticles = articles.filter(a => a.phase_status !== 'completato');
                const totalArticles = pendingArticles.length;
                const totalPieces = pendingArticles.reduce((sum, a) => sum + (a.qty || 0), 0);

                // Stato card: almeno uno in lavorazione?
                const hasActive = articles.some(a => a.phase_status === 'in_lavorazione');
                const allActive = articles.filter(a => a.phase_status !== 'completato').every(a => a.phase_status === 'in_lavorazione');
                const statusBadgeHtml = hasActive
                    ? '<span class="status-badge status-started">In Lavorazione</span>'
                    : '<span class="status-badge status-ready">In Attesa</span>';

                // Pulsante "Avvia Tutti": disabilitato se tutti già in lavorazione
                const avviaDisabled = allActive ? 'disabled' : '';
                const avviaTitle = allActive ? 'Tutti gli articoli sono già in lavorazione' : 'Avvia tutti gli articoli in attesa';

                // JSON articoli in_attesa per la callback "Avvia Tutti"
                const attesaArticles = articles.filter(a => a.phase_status === 'in_attesa');
                const attesaJson = JSON.stringify(attesaArticles).replace(/"/g, '&quot;');

                return `
                    <div class="order-card">
                        <div class="order-header">
                            <h3>${escapeHtml(order.cliente)}</h3>
                            <div class="order-id">${order.id.substring(0, 8)}</div>
                        </div>

                        <div class="order-info">
                            Consegna: <span class="info-strong">${new Date(order.data_consegna).toLocaleDateString('it-IT')}</span>
                        </div>

                        <div class="articles-section">
                            <h4>${totalArticles} Articol${totalArticles !== 1 ? 'i' : 'o'} in attesa (${totalPieces} pz)</h4>
                            ${articlesHtml}
                        </div>

                        ${statusBadgeHtml}

                        <div class="action-buttons">
                            <button class="btn-avvia" ${avviaDisabled} title="${avviaTitle}"
                                onclick="avviaTutti('${order.id}', '${attesaJson.replace(/'/g, "&#39;")}')">
                                Avvia Tutti
                            </button>
                            <button class="btn-complete" onclick="openPartialCompleteModal('${order.id}', ${JSON.stringify(articles).replace(/"/g, '&quot;')})">
                                Completa
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // ===== AZIONI =====

        // Avvia tutti gli articoli in_attesa per un ordine (per-articolo, sequenzialmente)
        async function avviaTutti(orderId, articlesJson) {
            let attesaArticles;
            try {
                attesaArticles = JSON.parse(articlesJson.replace(/&#39;/g, "'"));
            } catch (e) {
                showMessage('Errore parsing articoli', 'error');
                return;
            }

            if (!attesaArticles || attesaArticles.length === 0) {
                showMessage('Nessun articolo in attesa da avviare', 'info');
                return;
            }

            let avviati = 0;
            for (const article of attesaArticles) {
                if (!article.article_id) continue;
                try {
                    const response = await fetch(`${API_URL}/orders/${orderId}/phase/${PHASE}/start`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ article_id: article.article_id, operatore: '' })
                    });
                    const data = await response.json();
                    if (data.success) avviati++;
                } catch (e) {
                    console.error('Errore avvio articolo', article.article_id, e);
                }
            }

            if (avviati > 0) {
                showMessage(`Fase ${PHASE} avviata per ${avviati} articol${avviati !== 1 ? 'i' : 'o'}`, 'success');
                await loadOrders(true);
            } else {
                showMessage('Nessun articolo avviato', 'error');
            }
        }

        // Apre il modale di completamento parziale usando i dati articles_in_phase (UUID)
        async function openPartialCompleteModal(orderId, articlesParam) {
            let articles;
            if (typeof articlesParam === 'string') {
                try {
                    articles = JSON.parse(articlesParam.replace(/&#39;/g, "'"));
                } catch (e) {
                    articles = null;
                }
            } else if (Array.isArray(articlesParam)) {
                articles = articlesParam;
            }

            // Se non abbiamo i dati, li recuperiamo dal server
            if (!articles) {
                try {
                    const response = await fetch(`${API_URL}/phase/${PHASE}/orders`);
                    const orders = await response.json();
                    const order = (orders || []).find(o => o.id === orderId);
                    articles = order ? (order.articles_in_phase || []) : [];
                } catch (e) {
                    showMessage('Errore caricamento articoli', 'error');
                    return;
                }
            }

            currentOrderForCompletion = orderId;
            currentOrderArticles = articles;

            // Genera checkbox per articoli (usa article_id UUID)
            const checkboxesDiv = document.getElementById('articlesCheckboxes');
            checkboxesDiv.innerHTML = articles.map((article, idx) => {
                const isCompleted = article.phase_status === 'completato';
                const disabled = isCompleted ? 'disabled' : '';
                const checkedAttr = isCompleted ? 'checked' : '';
                const completedClass = isCompleted ? ' is-completed' : '';
                const statusBadge = isCompleted
                    ? '<span class="completed-tag">Completato</span>'
                    : (article.phase_status === 'in_lavorazione'
                        ? '<span style="color: var(--accent-cyan); font-size: 11px; margin-left: auto;">In lavorazione</span>'
                        : '');

                return `
                    <div class="modal-checkbox-item${completedClass}">
                        <input type="checkbox" id="article_cb_${idx}"
                            data-article-id="${article.article_id || ''}"
                            ${checkedAttr} ${disabled}>
                        <label for="article_cb_${idx}">
                            <strong>${escapeHtml(article.name)}</strong>
                            <span class="qty-tag">(${article.qty} pz)</span>
                            ${statusBadge}
                        </label>
                    </div>
                `;
            }).join('');

            // Mostra modale
            document.getElementById('partialCompleteModal').classList.add('show');
        }

        function selectAllModalCheckboxes() {
            currentOrderArticles.forEach((_, idx) => {
                const checkbox = document.getElementById(`article_cb_${idx}`);
                if (checkbox && !checkbox.disabled) {
                    checkbox.checked = true;
                }
            });
        }

        function closePartialModal() {
            document.getElementById('partialCompleteModal').classList.remove('show');
            currentOrderForCompletion = null;
            currentOrderArticles = [];
        }

        async function submitPartialComplete() {
            if (!currentOrderForCompletion) return;

            // Recupera UUID degli articoli selezionati
            const selectedIds = [];
            currentOrderArticles.forEach((article, idx) => {
                const checkbox = document.getElementById(`article_cb_${idx}`);
                if (checkbox && checkbox.checked && !checkbox.disabled) {
                    const articleId = checkbox.getAttribute('data-article-id');
                    if (articleId) selectedIds.push(articleId);
                }
            });

            if (selectedIds.length === 0) {
                showMessage('Seleziona almeno un articolo', 'error');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/orders/${currentOrderForCompletion}/phase/${PHASE}/complete-partial`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        article_ids: selectedIds,
                        note: ''
                    })
                });

                const data = await response.json();

                if (data.success) {
                    const n = selectedIds.length;
                    const msg = data.phase_complete
                        ? `Fase ${PHASE} completata per tutti gli articoli!`
                        : `${n} articolo${n !== 1 ? '/i' : ''} completato${n !== 1 ? '/i' : ''}`;
                    showMessage(msg, 'success');
                    closePartialModal();
                    await loadOrders(true);
                } else {
                    showMessage('Errore: ' + (data.error || 'Sconosciuto'), 'error');
                }
            } catch (error) {
                showMessage('Errore: ' + error.message, 'error');
            }
        }

        function updateSummary(orders) {
            let totalArticles = 0;
            let totalPieces = 0;

            orders.forEach(order => {
                // Conta solo gli articoli non completati nella fase
                const articlesInPhase = (order.articles_in_phase || []).filter(
                    a => a.phase_status !== 'completato'
                );
                totalArticles += articlesInPhase.length;
                totalPieces += articlesInPhase.reduce((sum, a) => sum + (a.qty || 0), 0);
            });

            const ordersEl = document.getElementById('countOrders');
            const articlesEl = document.getElementById('countArticles');
            const piecesEl = document.getElementById('countPieces');

            animateCountUp(ordersEl, orders.length);
            animateCountUp(articlesEl, totalArticles);
            animateCountUp(piecesEl, totalPieces);
        }

        function showMessage(msg, type) {
            const msgBox = document.getElementById('message');
            msgBox.textContent = msg;
            msgBox.className = `message ${type}`;

            setTimeout(() => {
                msgBox.className = 'message';
            }, 5000);
        }

        // Escape HTML per prevenire XSS
        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        // ===== INIT =====
        window.addEventListener('DOMContentLoaded', () => {
            loadOrders(true);
            setInterval(() => loadOrders(), 5000);
        });
    </script>
</body>
</html>
