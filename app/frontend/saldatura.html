<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stazione Saldatura - Schedulatore Laser</title>
    <link rel="stylesheet" href="/design.css">
    <style>
        /* Ambient background — tinta arancione specifica saldatura */
        body::before {
            background:
                radial-gradient(circle at 20% 50%, rgba(255, 99, 72, 0.04) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(168, 85, 247, 0.03) 0%, transparent 50%),
                radial-gradient(circle at 50% 80%, rgba(255, 99, 72, 0.02) 0%, transparent 50%);
        }

        /* ===== NAVBAR SEARCH ===== */
        .nav-spacer { flex: 1; }

        .nav-search-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .nav-search {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 13px;
            padding: 7px 12px 7px 32px;
            width: 200px;
            transition: var(--transition);
            font-family: inherit;
        }

        .nav-search::placeholder { color: var(--text-muted); }

        .nav-search:focus {
            outline: none;
            border-color: color-mix(in srgb, var(--page-accent) 40%, transparent);
            background: rgba(255, 255, 255, 0.07);
            width: 240px;
        }

        .nav-search-icon {
            position: absolute;
            left: 10px;
            color: var(--text-muted);
            font-size: 14px;
            pointer-events: none;
        }

        nav a { min-height: 40px; display: inline-flex; align-items: center; }

        /* ===== PAGE HEADER ===== */
        .page-header {
            margin-bottom: 24px;
            animation: fadeInUp 0.6s ease both;
        }

        .page-header h2 {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, var(--accent-orange), #ff8c42);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        .page-header p {
            color: var(--text-secondary);
            font-size: 14px;
        }

        /* ===== FILTER CHIPS ===== */
        .filter-chips {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid var(--border-glass);
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-secondary);
            transition: var(--transition);
            user-select: none;
        }

        .chip:hover {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-primary);
        }

        .chip.active {
            background: color-mix(in srgb, var(--page-accent) 15%, transparent);
            border-color: color-mix(in srgb, var(--page-accent) 40%, transparent);
            color: var(--page-accent);
        }

        .chip-count {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 1px 7px;
            font-size: 11px;
            font-weight: 700;
        }

        .chip.active .chip-count {
            background: color-mix(in srgb, var(--page-accent) 20%, transparent);
        }

        /* ===== MESSAGES ===== */
        .message {
            padding: 14px 20px;
            border-radius: var(--radius-sm);
            margin-bottom: 20px;
            display: none;
            font-size: 14px;
            font-weight: 500;
            animation: fadeInUp 0.3s ease both;
            backdrop-filter: blur(10px);
        }

        .message.success {
            background: rgba(0, 230, 118, 0.1);
            color: var(--accent-green);
            border: 1px solid rgba(0, 230, 118, 0.2);
            display: block;
        }

        .message.error {
            background: rgba(255, 71, 87, 0.1);
            color: var(--accent-red);
            border: 1px solid rgba(255, 71, 87, 0.2);
            display: block;
        }

        .message.info {
            background: color-mix(in srgb, var(--page-accent) 10%, transparent);
            color: var(--page-accent);
            border: 1px solid color-mix(in srgb, var(--page-accent) 20%, transparent);
            display: block;
        }

        /* ===== SUMMARY STATS ===== */
        .summary-box {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 32px;
            animation: fadeInUp 0.6s ease both;
            animation-delay: 0.1s;
        }

        .summary-item {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-lg);
            padding: 24px;
            text-align: center;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .summary-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--page-accent), transparent);
            opacity: 0.5;
        }

        .summary-item:hover {
            background: var(--bg-card-hover);
            border-color: color-mix(in srgb, var(--page-accent) 20%, transparent);
            transform: translateY(-2px);
            box-shadow: 0 8px 32px color-mix(in srgb, var(--page-accent) 8%, transparent);
        }

        .summary-number {
            font-size: 36px;
            font-weight: 800;
            color: var(--page-accent);
            line-height: 1;
            margin-bottom: 8px;
            font-variant-numeric: tabular-nums;
        }

        .summary-label {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        /* ===== ORDERS GRID ===== */
        .orders-grid {
            display: grid;
            gap: 20px;
            animation: fadeInUp 0.6s ease both;
            animation-delay: 0.2s;
        }

        @media (max-width: 1023px) {
            .orders-grid { grid-template-columns: 1fr; }
        }

        @media (min-width: 1024px) {
            .orders-grid { grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); }
        }

        /* ===== ORDER CARD ===== */
        .order-card {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-glass);
            border-top: 2px solid color-mix(in srgb, var(--page-accent) 50%, transparent);
            border-radius: var(--radius-lg);
            padding: 24px;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
            animation: fadeInUp 0.5s ease both;
        }

        .order-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: linear-gradient(180deg, color-mix(in srgb, var(--page-accent) 4%, transparent) 0%, transparent 100%);
            pointer-events: none;
        }

        .order-card:hover {
            background: var(--bg-card-hover);
            border-color: color-mix(in srgb, var(--page-accent) 30%, transparent);
            transform: translateY(-3px);
            box-shadow: 0 12px 40px color-mix(in srgb, var(--page-accent) 8%, transparent), 0 0 20px color-mix(in srgb, var(--page-accent) 4%, transparent);
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
            position: relative;
        }

        .order-card h3 {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .order-card h3::before {
            content: '';
            width: 3px;
            height: 16px;
            background: var(--page-accent);
            border-radius: 2px;
            box-shadow: 0 0 8px var(--page-accent);
            flex-shrink: 0;
        }

        .order-id {
            font-size: 10px;
            color: var(--text-muted);
            background: rgba(255, 255, 255, 0.05);
            padding: 3px 8px;
            border-radius: 4px;
            font-family: 'Courier New', 'Lucida Console', monospace;
            font-weight: 500;
            border: 1px solid var(--border-glass);
        }

        .order-info {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 8px;
            padding-left: 11px;
        }

        .info-strong {
            color: var(--text-primary);
            font-weight: 600;
        }

        /* ===== ARTICLES SECTION ===== */
        .articles-section {
            margin: 16px 0;
            padding: 14px;
            background: color-mix(in srgb, var(--page-accent) 4%, transparent);
            border: 1px solid color-mix(in srgb, var(--page-accent) 10%, transparent);
            border-radius: var(--radius-md);
        }

        .articles-section h4 {
            color: var(--page-accent);
            font-size: 11px;
            font-weight: 700;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .article-item {
            font-size: 13px;
            color: var(--text-primary);
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .article-item:last-child { border-bottom: none; }

        .article-name {
            font-weight: 600;
            color: var(--text-primary);
        }

        .article-qty {
            font-size: 12px;
            color: var(--text-secondary);
            font-family: 'Courier New', 'Lucida Console', monospace;
        }

        /* ===== TIMER DISPLAY ===== */
        .timer-display {
            display: none;
            background: color-mix(in srgb, var(--page-accent) 10%, transparent);
            border: 1px solid color-mix(in srgb, var(--page-accent) 30%, transparent);
            color: var(--page-accent);
            padding: 16px;
            border-radius: 12px;
            margin: 12px 0;
            text-align: center;
            font-size: 36px;
            font-weight: 800;
            font-family: 'Courier New', 'Lucida Console', monospace;
            letter-spacing: 4px;
        }

        .timer-display.active {
            display: block;
            animation: glowPulse 2s ease-in-out infinite;
        }

        @keyframes glowPulse {
            0%, 100% { box-shadow: 0 0 20px color-mix(in srgb, var(--page-accent) 15%, transparent); }
            50% { box-shadow: 0 0 40px color-mix(in srgb, var(--page-accent) 30%, transparent); }
        }

        .timer-label {
            font-size: 10px;
            color: color-mix(in srgb, var(--page-accent) 70%, transparent);
            margin-top: 6px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            font-weight: 600;
        }

        /* ===== STATUS BADGE ===== */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            margin-top: 8px;
            letter-spacing: 0.3px;
        }

        .status-ready {
            background: color-mix(in srgb, var(--page-accent) 10%, transparent);
            color: var(--page-accent);
            border: 1px solid color-mix(in srgb, var(--page-accent) 20%, transparent);
        }

        .status-started {
            background: rgba(0, 212, 255, 0.1);
            color: var(--accent-cyan);
            border: 1px solid rgba(0, 212, 255, 0.2);
        }

        /* ===== ACTION BUTTONS ===== */
        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }

        .btn-avvia {
            flex: 1;
            background: linear-gradient(135deg, var(--page-accent), color-mix(in srgb, var(--page-accent) 80%, #000));
            color: #fff;
            border: none;
            padding: 12px 16px;
            min-height: 56px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 13px;
            font-weight: 700;
            font-family: inherit;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
            letter-spacing: 0.3px;
        }

        .btn-avvia:hover {
            box-shadow: 0 0 30px color-mix(in srgb, var(--page-accent) 30%, transparent), 0 4px 15px rgba(0, 0, 0, 0.3);
            transform: translateY(-2px);
        }

        .btn-avvia:active { transform: translateY(0); }

        .btn-avvia:disabled {
            background: var(--text-muted);
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
            opacity: 0.5;
        }

        .btn-complete {
            flex: 1;
            background: linear-gradient(135deg, var(--accent-green), #00b862);
            color: #000;
            border: none;
            padding: 12px 16px;
            min-height: 56px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 13px;
            font-weight: 700;
            font-family: inherit;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
            letter-spacing: 0.3px;
        }

        .btn-complete:hover {
            box-shadow: 0 0 30px rgba(0, 230, 118, 0.3), 0 4px 15px rgba(0, 0, 0, 0.3);
            transform: translateY(-2px);
        }

        .btn-complete:active { transform: translateY(0); }

        .btn-complete:disabled {
            background: var(--text-muted);
            color: var(--text-secondary);
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
            opacity: 0.5;
        }

        /* ===== MODAL BUTTONS TOUCH TARGETS ===== */
        .btn-modal-cancel,
        .btn-modal-confirm,
        .btn-modal-select-all {
            min-height: 48px;
        }

        /* ===== EMPTY STATE ===== */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 80px 24px;
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-lg);
            color: var(--text-secondary);
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.6;
        }

        .empty-state h3 {
            color: var(--text-primary);
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .empty-state p {
            color: var(--text-secondary);
            font-size: 14px;
        }

        /* ===== MODAL ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            animation: modalFadeIn 0.3s ease both;
        }

        .modal-overlay.show {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @keyframes modalFadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background: rgba(17, 24, 39, 0.95);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-lg);
            padding: 32px;
            width: 90%;
            max-width: 520px;
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.5), 0 0 40px color-mix(in srgb, var(--page-accent) 5%, transparent);
            animation: modalSlideUp 0.3s ease both;
            position: relative;
            overflow: hidden;
        }

        .modal-content::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--page-accent), transparent);
        }

        @keyframes modalSlideUp {
            from { opacity: 0; transform: translateY(20px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .modal-title {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -0.3px;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .modal-subtitle {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 20px;
        }

        .modal-checkboxes {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-glass);
            padding: 8px;
            border-radius: var(--radius-md);
            margin-bottom: 24px;
            max-height: 300px;
            overflow-y: auto;
        }

        .modal-checkbox-item {
            padding: 12px;
            margin-bottom: 8px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-glass);
            display: flex;
            align-items: center;
            gap: 12px;
            transition: var(--transition);
            cursor: pointer;
        }

        .modal-checkbox-item:last-child { margin-bottom: 0; }

        .modal-checkbox-item:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.1);
        }

        .modal-checkbox-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--page-accent);
            cursor: pointer;
            flex-shrink: 0;
        }

        .modal-checkbox-item label {
            flex: 1;
            cursor: pointer;
            color: var(--text-primary);
            font-weight: 500;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .modal-checkbox-item label .qty-tag {
            color: var(--text-secondary);
            font-size: 12px;
        }

        .modal-checkbox-item label .completed-tag {
            color: var(--accent-green);
            margin-left: auto;
            font-size: 11px;
            font-weight: 600;
            background: rgba(0, 230, 118, 0.1);
            padding: 2px 8px;
            border-radius: 4px;
        }

        .modal-checkbox-item.is-completed { opacity: 0.6; }

        .btn-modal-select-all {
            background: rgba(0, 212, 255, 0.1);
            color: var(--accent-cyan);
            border: 1px solid rgba(0, 212, 255, 0.2);
            padding: 6px 14px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            font-family: inherit;
            transition: var(--transition);
            margin-bottom: 12px;
        }

        .btn-modal-select-all:hover {
            background: rgba(0, 212, 255, 0.15);
            border-color: rgba(0, 212, 255, 0.3);
        }

        .modal-buttons { display: flex; gap: 10px; }

        .btn-modal-cancel {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-secondary);
            border: 1px solid var(--border-glass);
            padding: 12px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            font-family: inherit;
            transition: var(--transition);
        }

        .btn-modal-cancel:hover {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-primary);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .btn-modal-confirm {
            flex: 1;
            background: linear-gradient(135deg, var(--accent-green), #00b862);
            color: #000;
            border: none;
            padding: 12px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-weight: 700;
            font-size: 13px;
            font-family: inherit;
            transition: var(--transition);
        }

        .btn-modal-confirm:hover {
            box-shadow: 0 0 20px rgba(0, 230, 118, 0.3);
            transform: translateY(-1px);
        }

        /* ===== STATI ARTICOLO PER-FASE ===== */
        .article-status-attesa {
            color: var(--text-secondary);
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .article-status-lavorazione {
            color: var(--accent-cyan);
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .article-status-lavorazione::before {
            content: '';
            display: inline-block;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--accent-cyan);
            box-shadow: 0 0 6px var(--accent-cyan);
            animation: pulse-dot 1.5s ease-in-out infinite;
            flex-shrink: 0;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.7); }
        }

        .article-status-completato {
            color: var(--accent-green);
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            opacity: 0.5;
        }

        .article-item.completato { opacity: 0.45; }

        /* ===== ANIMATIONS ===== */
        @keyframes countUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .count-animate { animation: countUp 0.4s ease both; }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .summary-box { grid-template-columns: 1fr; }
            .action-buttons { flex-direction: column; }
            .modal-content { padding: 24px; }
            .modal-buttons { flex-direction: column; }
            .page-header h2 { font-size: 22px; }
            .summary-number { font-size: 28px; }
            .nav-search { width: 140px; }
            .nav-search:focus { width: 180px; }
        }

        @media (max-width: 480px) {
            .nav-search { display: none; }
        }
    </style>
</head>
<body data-page="saldatura">
    <!-- Navbar -->
    <nav>
        <div class="nav-logo">Schedulatore Laser</div>
        <a href="ordini-estratti">Ordini Estratti</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="laser.html">Laser</a>
        <a href="piega.html">Piega</a>
        <a href="saldatura.html" class="active">Saldatura</a>
        <a href="archive.html">Archivio</a>
        <div class="nav-spacer"></div>
        <div class="nav-search-wrapper">
            <span class="nav-search-icon">&#128269;</span>
            <input type="search" class="nav-search" id="navSearch"
                placeholder="Cerca cliente o ID..."
                oninput="onSearch(this.value)">
        </div>
    </nav>

    <main>
        <div class="page-header">
            <h2>Stazione SALDATURA</h2>
            <p>Articoli in attesa di lavorazione in saldatura</p>
        </div>

        <!-- Chip filtri stato -->
        <div class="filter-chips">
            <div class="chip active" id="chip-all" onclick="setStatusFilter('all')">
                Tutti <span class="chip-count" id="count-all">0</span>
            </div>
            <div class="chip" id="chip-attesa" onclick="setStatusFilter('attesa')">
                In Attesa <span class="chip-count" id="count-attesa">0</span>
            </div>
            <div class="chip" id="chip-lavorazione" onclick="setStatusFilter('lavorazione')">
                In Lavorazione <span class="chip-count" id="count-lavorazione">0</span>
            </div>
        </div>

        <div id="message" class="message"></div>

        <div class="summary-box">
            <div class="summary-item">
                <div class="summary-number" id="countOrders">0</div>
                <div class="summary-label">Ordini</div>
            </div>
            <div class="summary-item">
                <div class="summary-number" id="countArticles">0</div>
                <div class="summary-label">Articoli</div>
            </div>
            <div class="summary-item">
                <div class="summary-number" id="countPieces">0</div>
                <div class="summary-label">Pezzi Totali</div>
            </div>
        </div>

        <div class="orders-grid" id="ordersContainer"></div>
    </main>

    <!-- MODALE COMPLETAMENTO PARZIALE -->
    <div id="partialCompleteModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-title">Completa Fase SALDATURA</div>
            <p class="modal-subtitle">Seleziona gli articoli completati per questa fase:</p>

            <button class="btn-modal-select-all" onclick="selectAllModalCheckboxes()">
                Seleziona Tutti
            </button>

            <div id="articlesCheckboxes" class="modal-checkboxes">
                <!-- Checkbox articoli generati dinamicamente -->
            </div>

            <div class="modal-buttons">
                <button onclick="closePartialModal()" class="btn-modal-cancel">
                    Annulla
                </button>
                <button onclick="submitPartialComplete()" class="btn-modal-confirm">
                    Completa Selezionati
                </button>
            </div>
        </div>
    </div>

    <script src="/shared.js"></script>
    <script>
        // Usa URL relativo per funzionare su localhost e IP
        const API_URL = '/api';
        const PHASE = 'SALDATURA';

        // Timer e stato attivo per ordine — vivono FUORI da renderOrders per sopravvivere al re-render
        const timers = {};
        const activePhases = {}; // { orderId: { startTime, displayTime } }

        // Stato filtri e dati
        let allOrders = [];
        let searchQuery = '';
        let statusFilter = 'all';
        let lastDataHash = null;

        // Stato modale completamento parziale
        let currentOrderForCompletion = null;
        let currentOrderArticles = [];

        // Ricerca debounced
        const debouncedSearch = debounce(() => applyFiltersAndRender(), 300);

        function onSearch(value) {
            searchQuery = value;
            debouncedSearch();
        }

        function setStatusFilter(filter) {
            statusFilter = filter;
            ['all', 'attesa', 'lavorazione'].forEach(f => {
                document.getElementById('chip-' + f).classList.toggle('active', f === filter);
            });
            applyFiltersAndRender();
        }

        function applyFiltersAndRender() {
            let filtered = filterOrders(allOrders, searchQuery);

            if (statusFilter === 'attesa') {
                filtered = filtered.filter(order => {
                    const arts = order.articles_in_phase || [];
                    return arts.some(a => a.phase_status !== 'completato') &&
                           !arts.some(a => a.phase_status === 'in_lavorazione');
                });
            } else if (statusFilter === 'lavorazione') {
                filtered = filtered.filter(order =>
                    (order.articles_in_phase || []).some(a => a.phase_status === 'in_lavorazione')
                );
            }

            updateChipCounts(allOrders);
            renderOrders(filtered);
            updateSummary(filtered);
        }

        function updateChipCounts(orders) {
            const total = orders.filter(o =>
                (o.articles_in_phase || []).some(a => a.phase_status !== 'completato')
            ).length;
            const attesa = orders.filter(o => {
                const arts = o.articles_in_phase || [];
                return arts.some(a => a.phase_status !== 'completato') &&
                       !arts.some(a => a.phase_status === 'in_lavorazione');
            }).length;
            const lavorazione = orders.filter(o =>
                (o.articles_in_phase || []).some(a => a.phase_status === 'in_lavorazione')
            ).length;

            document.getElementById('count-all').textContent = total;
            document.getElementById('count-attesa').textContent = attesa;
            document.getElementById('count-lavorazione').textContent = lavorazione;
        }

        // Carica ordini al caricamento
        window.addEventListener('DOMContentLoaded', () => {
            loadOrders();
            // Auto-refresh ogni 5 secondi — filtri e timer preservati
            setInterval(loadOrders, 5000);
        });

        async function loadOrders(forceRender) {
            try {
                const response = await fetch(`${API_URL}/phase/${PHASE}/orders`);
                const orders = await response.json();
                const orderList = Array.isArray(orders) ? orders : [];

                const { changed, newHash } = hasDataChanged(orderList, lastDataHash);
                if (!forceRender && !changed) return;
                lastDataHash = newHash;

                allOrders = orderList;
                applyFiltersAndRender();
            } catch (error) {
                console.error('Errore caricamento ordini:', error);
                showMessage('Errore connessione al server', 'error');
            }
        }

        function articleStatusBadge(status) {
            if (status === 'in_lavorazione') {
                return '<span class="article-status-lavorazione">In lavorazione</span>';
            } else if (status === 'completato') {
                return '<span class="article-status-completato">Completato</span>';
            } else {
                return '<span class="article-status-attesa">In attesa</span>';
            }
        }

        function renderOrders(orders) {
            const container = document.getElementById('ordersContainer');

            const activeOrders = orders.filter(order =>
                (order.articles_in_phase || []).some(a => a.phase_status !== 'completato')
            );

            if (activeOrders.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">&#10003;</div>
                        <h3>Nessun Lavoro</h3>
                        <p>Non ci sono articoli in attesa per questa fase</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = activeOrders.map(order => {
                const articles = order.articles_in_phase || [];

                const articlesHtml = articles.map(article => {
                    const isCompletato = article.phase_status === 'completato';
                    const itemClass = isCompletato ? ' completato' : '';
                    return `
                        <div class="article-item${itemClass}">
                            <span>
                                <span class="article-name">${escapeHtml(article.name)}</span>
                                <span class="article-qty"> — ${article.code ? article.code + ' · ' : ''}${article.qty} pz</span>
                            </span>
                            ${articleStatusBadge(article.phase_status)}
                        </div>
                    `;
                }).join('');

                const pendingArticles = articles.filter(a => a.phase_status !== 'completato');
                const totalArticles = pendingArticles.length;
                const totalPieces = pendingArticles.reduce((sum, a) => sum + (a.qty || 0), 0);

                const hasActive = articles.some(a => a.phase_status === 'in_lavorazione');
                const allActive = articles.filter(a => a.phase_status !== 'completato').every(a => a.phase_status === 'in_lavorazione');
                const statusBadgeHtml = hasActive
                    ? '<span class="status-badge status-started">In Lavorazione</span>'
                    : '<span class="status-badge status-ready">In Attesa</span>';

                const avviaDisabled = allActive ? 'disabled' : '';
                const avviaTitle = allActive ? 'Tutti gli articoli sono gia in lavorazione' : 'Avvia tutti gli articoli in attesa';

                const attesaArticles = articles.filter(a => a.phase_status === 'in_attesa');
                const attesaJson = JSON.stringify(attesaArticles).replace(/"/g, '&quot;');

                const isTimerActive = !!activePhases[order.id];
                const timerValue = isTimerActive ? activePhases[order.id].displayTime : '00:00';

                return `
                    <div class="order-card">
                        <div class="order-header">
                            <h3>${escapeHtml(order.cliente)}</h3>
                            <div class="order-id">${order.id.substring(0, 8)}</div>
                        </div>

                        <div class="order-info">
                            Consegna: <span class="info-strong">${new Date(order.data_consegna).toLocaleDateString('it-IT')}</span>
                        </div>

                        <div class="articles-section">
                            <h4>${totalArticles} Articol${totalArticles !== 1 ? 'i' : 'o'} in attesa (${totalPieces} pz)</h4>
                            ${articlesHtml}
                        </div>

                        <div class="timer-display ${isTimerActive ? 'active' : ''}" id="timer-${order.id}">
                            <div id="timer-value-${order.id}">${timerValue}</div>
                            <div class="timer-label">Tempo Lavorazione</div>
                        </div>

                        ${statusBadgeHtml}

                        <div class="action-buttons">
                            <button class="btn-avvia" ${avviaDisabled} title="${avviaTitle}"
                                onclick="avviaTutti('${order.id}', '${attesaJson.replace(/'/g, "&#39;")}')">
                                Avvia Tutti
                            </button>
                            <button class="btn-complete" onclick="openPartialCompleteModal('${order.id}', ${JSON.stringify(articles).replace(/"/g, '&quot;')})">
                                Completa
                            </button>
                        </div>
                    </div>
                `;
            }).join('');

            // Ripristina i timer per gli ordini attivi dopo il re-render
            Object.keys(activePhases).forEach(orderId => {
                const active = activePhases[orderId];
                restoreTimer(orderId, active.startTime);
            });
        }

        async function avviaTutti(orderId, articlesJson) {
            let attesaArticles;
            try {
                attesaArticles = JSON.parse(articlesJson.replace(/&#39;/g, "'"));
            } catch (e) {
                showMessage('Errore parsing articoli', 'error');
                return;
            }

            if (!attesaArticles || attesaArticles.length === 0) {
                showMessage('Nessun articolo in attesa da avviare', 'info');
                return;
            }

            let avviati = 0;
            for (const article of attesaArticles) {
                if (!article.article_id) continue;
                try {
                    const response = await fetch(`${API_URL}/orders/${orderId}/phase/${PHASE}/start`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ article_id: article.article_id, operatore: '' })
                    });
                    const data = await response.json();
                    if (data.success) avviati++;
                } catch (e) {
                    console.error('Errore avvio articolo', article.article_id, e);
                }
            }

            if (avviati > 0) {
                if (!activePhases[orderId]) {
                    activePhases[orderId] = {
                        startTime: Date.now(),
                        displayTime: '00:00'
                    };
                    startTimer(orderId);
                }
                showMessage(`Fase ${PHASE} avviata per ${avviati} articol${avviati !== 1 ? 'i' : 'o'}`, 'success');
                await loadOrders();
            } else {
                showMessage('Nessun articolo avviato', 'error');
            }
        }

        function startTimer(orderId) {
            if (timers[orderId]) {
                clearInterval(timers[orderId]);
            }

            const timerDisplay = document.getElementById(`timer-${orderId}`);
            const timerValue = document.getElementById(`timer-value-${orderId}`);

            if (timerDisplay) timerDisplay.classList.add('active');

            let seconds = 0;
            timers[orderId] = setInterval(() => {
                seconds++;
                const mins = Math.floor(seconds / 60);
                const secs = seconds % 60;
                const display = String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0');
                if (timerValue) timerValue.textContent = display;

                if (activePhases[orderId]) {
                    activePhases[orderId].displayTime = display;
                }
            }, 1000);
        }

        function restoreTimer(orderId, startTime) {
            if (timers[orderId]) {
                clearInterval(timers[orderId]);
            }

            const timerDisplay = document.getElementById(`timer-${orderId}`);
            const timerValue = document.getElementById(`timer-value-${orderId}`);

            if (!timerDisplay || !timerValue) return;

            timerDisplay.classList.add('active');

            timers[orderId] = setInterval(() => {
                const elapsed = Math.floor((Date.now() - startTime) / 1000);
                const mins = Math.floor(elapsed / 60);
                const secs = elapsed % 60;
                const display = String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0');
                timerValue.textContent = display;

                if (activePhases[orderId]) {
                    activePhases[orderId].displayTime = display;
                }
            }, 1000);
        }

        async function openPartialCompleteModal(orderId, articlesParam) {
            if (timers[orderId]) {
                clearInterval(timers[orderId]);
            }

            let articles;
            if (typeof articlesParam === 'string') {
                try {
                    articles = JSON.parse(articlesParam.replace(/&#39;/g, "'"));
                } catch (e) {
                    articles = null;
                }
            } else if (Array.isArray(articlesParam)) {
                articles = articlesParam;
            }

            if (!articles) {
                try {
                    const response = await fetch(`${API_URL}/phase/${PHASE}/orders`);
                    const orders = await response.json();
                    const order = (orders || []).find(o => o.id === orderId);
                    articles = order ? (order.articles_in_phase || []) : [];
                } catch (e) {
                    showMessage('Errore caricamento articoli', 'error');
                    return;
                }
            }

            currentOrderForCompletion = orderId;
            currentOrderArticles = articles;

            const checkboxesDiv = document.getElementById('articlesCheckboxes');
            checkboxesDiv.innerHTML = articles.map((article, idx) => {
                const isCompleted = article.phase_status === 'completato';
                const disabled = isCompleted ? 'disabled' : '';
                const checkedAttr = isCompleted ? 'checked' : '';
                const completedClass = isCompleted ? ' is-completed' : '';
                const statusBadge = isCompleted
                    ? '<span class="completed-tag">Completato</span>'
                    : (article.phase_status === 'in_lavorazione'
                        ? '<span style="color: var(--accent-cyan); font-size: 11px; margin-left: auto;">In lavorazione</span>'
                        : '');

                return `
                    <div class="modal-checkbox-item${completedClass}">
                        <input type="checkbox" id="article_cb_${idx}"
                            data-article-id="${article.article_id || ''}"
                            ${checkedAttr} ${disabled}>
                        <label for="article_cb_${idx}">
                            <strong>${escapeHtml(article.name)}</strong>
                            <span class="qty-tag">(${article.qty} pz)</span>
                            ${statusBadge}
                        </label>
                    </div>
                `;
            }).join('');

            document.getElementById('partialCompleteModal').classList.add('show');
        }

        function selectAllModalCheckboxes() {
            currentOrderArticles.forEach((_, idx) => {
                const checkbox = document.getElementById(`article_cb_${idx}`);
                if (checkbox && !checkbox.disabled) {
                    checkbox.checked = true;
                }
            });
        }

        function closePartialModal() {
            document.getElementById('partialCompleteModal').classList.remove('show');
            if (currentOrderForCompletion && activePhases[currentOrderForCompletion]) {
                restoreTimer(currentOrderForCompletion, activePhases[currentOrderForCompletion].startTime);
            }
            currentOrderForCompletion = null;
            currentOrderArticles = [];
        }

        async function submitPartialComplete() {
            if (!currentOrderForCompletion) return;

            const selectedIds = [];
            currentOrderArticles.forEach((article, idx) => {
                const checkbox = document.getElementById(`article_cb_${idx}`);
                if (checkbox && checkbox.checked && !checkbox.disabled) {
                    const articleId = checkbox.getAttribute('data-article-id');
                    if (articleId) selectedIds.push(articleId);
                }
            });

            if (selectedIds.length === 0) {
                showMessage('Seleziona almeno un articolo', 'error');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/orders/${currentOrderForCompletion}/phase/${PHASE}/complete-partial`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        article_ids: selectedIds,
                        note: ''
                    })
                });

                const data = await response.json();

                if (data.success) {
                    const n = selectedIds.length;
                    const msg = data.phase_complete
                        ? `Fase ${PHASE} completata per tutti gli articoli!`
                        : `${n} articolo${n !== 1 ? '/i' : ''} completato${n !== 1 ? '/i' : ''}`;
                    showMessage(msg, 'success');
                    if (currentOrderForCompletion && timers[currentOrderForCompletion]) {
                        clearInterval(timers[currentOrderForCompletion]);
                    }
                    delete activePhases[currentOrderForCompletion];
                    document.getElementById('partialCompleteModal').classList.remove('show');
                    currentOrderForCompletion = null;
                    currentOrderArticles = [];
                    await loadOrders();
                } else {
                    showMessage('Errore: ' + (data.error || 'Sconosciuto'), 'error');
                }
            } catch (error) {
                showMessage('Errore: ' + error.message, 'error');
            }
        }

        function updateSummary(orders) {
            const totalOrders = orders.filter(o =>
                (o.articles_in_phase || []).some(a => a.phase_status !== 'completato')
            ).length;
            let totalArticles = 0;
            let totalPieces = 0;

            orders.forEach(order => {
                const articlesInPhase = (order.articles_in_phase || []).filter(
                    a => a.phase_status !== 'completato'
                );
                totalArticles += articlesInPhase.length;
                totalPieces += articlesInPhase.reduce((sum, a) => sum + (a.qty || 0), 0);
            });

            document.getElementById('countOrders').textContent = totalOrders;
            document.getElementById('countArticles').textContent = totalArticles;
            document.getElementById('countPieces').textContent = totalPieces;
        }

        function showMessage(msg, type) {
            const msgBox = document.getElementById('message');
            msgBox.textContent = msg;
            msgBox.className = `message ${type}`;

            setTimeout(() => {
                msgBox.className = 'message';
            }, 5000);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        document.getElementById('partialCompleteModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closePartialModal();
            }
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closePartialModal();
            }
        });
    </script>
</body>
</html>
