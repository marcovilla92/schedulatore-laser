<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stazione Saldatura - Schedulatore Laser</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #111827;
            --bg-card: rgba(255, 255, 255, 0.03);
            --bg-card-hover: rgba(255, 255, 255, 0.06);
            --bg-input: rgba(255, 255, 255, 0.05);
            --border-glass: rgba(255, 255, 255, 0.06);
            --border-hover: rgba(0, 212, 255, 0.3);
            --text-primary: #e6e6e6;
            --text-secondary: #6b7b8d;
            --text-muted: #4a5568;
            --accent-cyan: #00d4ff;
            --accent-green: #00e676;
            --accent-red: #ff4757;
            --accent-amber: #ffa502;
            --accent-orange: #ff6348;
            --accent-purple: #a855f7;
            --radius-lg: 16px;
            --radius-md: 12px;
            --radius-sm: 8px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Ambient background */
        body::before {
            content: '';
            position: fixed;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(255, 99, 72, 0.12) 0%, transparent 45%),
                radial-gradient(ellipse at 80% 20%, rgba(168, 85, 247, 0.08) 0%, transparent 45%),
                radial-gradient(ellipse at 50% 80%, rgba(255, 165, 2, 0.06) 0%, transparent 45%),
                radial-gradient(ellipse at 70% 60%, rgba(0, 212, 255, 0.04) 0%, transparent 40%);
            filter: blur(40px);
            animation: auroraFloat 20s ease-in-out infinite;
            z-index: 0;
            pointer-events: none;
        }

        @keyframes auroraFloat {
            0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.8; }
            25% { transform: translate(3%, -2%) scale(1.02); opacity: 1; }
            50% { transform: translate(-2%, 3%) scale(0.98); opacity: 0.9; }
            75% { transform: translate(2%, 2%) scale(1.01); opacity: 1; }
        }

        /* ===== NAVBAR ===== */
        nav {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 64px;
            background: rgba(10, 10, 15, 0.8);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-bottom: 1px solid var(--border-glass);
            display: flex;
            align-items: center;
            padding: 0 24px;
            gap: 6px;
            z-index: 1000;
        }

        .nav-logo {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-green));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-right: 32px;
            white-space: nowrap;
        }

        nav a {
            color: var(--text-secondary);
            text-decoration: none;
            padding: 8px 16px;
            border-radius: var(--radius-sm);
            transition: var(--transition);
            font-size: 13px;
            font-weight: 500;
            white-space: nowrap;
            position: relative;
        }

        nav a:hover {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.05);
        }

        nav a.active {
            color: var(--accent-orange);
            background: rgba(255, 99, 72, 0.1);
            font-weight: 600;
            box-shadow: 0 0 20px rgba(255, 99, 72, 0.1);
        }

        /* ===== MAIN ===== */
        main {
            position: relative;
            z-index: 1;
            margin-top: 88px;
            padding: 0 24px 60px;
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
        }

        /* ===== PAGE HEADER ===== */
        .page-header {
            margin-bottom: 32px;
            animation: fadeInUp 0.6s ease both;
        }

        .page-header h2 {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, var(--accent-orange), #ff8c42);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        .page-header p {
            color: var(--text-secondary);
            font-size: 14px;
        }

        /* ===== MESSAGES ===== */
        .message {
            padding: 14px 20px;
            border-radius: var(--radius-sm);
            margin-bottom: 20px;
            display: none;
            font-size: 14px;
            font-weight: 500;
            animation: fadeInUp 0.3s ease both;
            backdrop-filter: blur(10px);
        }

        .message.success {
            background: rgba(0, 230, 118, 0.1);
            color: var(--accent-green);
            border: 1px solid rgba(0, 230, 118, 0.2);
            display: block;
        }

        .message.error {
            background: rgba(255, 71, 87, 0.1);
            color: var(--accent-red);
            border: 1px solid rgba(255, 71, 87, 0.2);
            display: block;
        }

        .message.info {
            background: rgba(255, 99, 72, 0.1);
            color: var(--accent-orange);
            border: 1px solid rgba(255, 99, 72, 0.2);
            display: block;
        }

        /* ===== SUMMARY BOX ===== */
        .summary-box {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-lg);
            padding: 24px;
            margin-bottom: 28px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            text-align: center;
            animation: fadeInUp 0.6s ease both;
            animation-delay: 0.1s;
            transition: var(--transition);
        }

        .summary-box:hover {
            background: var(--bg-card-hover);
            border-color: rgba(255, 255, 255, 0.1);
        }

        .summary-item {
            padding: 12px 0;
            border-right: 1px solid var(--border-glass);
        }

        .summary-item:last-child {
            border-right: none;
        }

        .summary-number {
            font-size: 36px;
            font-weight: 800;
            color: var(--accent-orange);
            letter-spacing: -1px;
            line-height: 1;
        }

        .summary-label {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 8px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 600;
        }

        /* ===== ORDERS GRID ===== */
        .orders-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 20px;
            animation: fadeInUp 0.6s ease both;
            animation-delay: 0.2s;
        }

        /* ===== ORDER CARD ===== */
        .order-card {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-glass);
            border-top: 2px solid rgba(255, 99, 72, 0.5);
            border-radius: var(--radius-lg);
            padding: 24px;
            transition: var(--transition);
        }

        .order-card:hover {
            background: var(--bg-card-hover);
            border-color: rgba(255, 255, 255, 0.1);
            border-top-color: rgba(255, 99, 72, 0.8);
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3), 0 0 30px rgba(255, 99, 72, 0.08);
        }

        /* Spotlight effect (React Bits inspired) */
        .order-card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            opacity: 0;
            background: radial-gradient(
                600px circle at var(--mouse-x, 50%) var(--mouse-y, 50%),
                rgba(255, 255, 255, 0.06) 0%,
                transparent 60%
            );
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 1;
        }

        .order-card:hover::before {
            opacity: 1;
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 12px;
        }

        .order-card h3 {
            color: var(--text-primary);
            font-size: 16px;
            font-weight: 700;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .order-card h3::before {
            content: '';
            width: 3px;
            height: 16px;
            background: var(--accent-orange);
            border-radius: 2px;
            box-shadow: 0 0 8px var(--accent-orange);
        }

        .order-id {
            font-size: 11px;
            color: var(--text-muted);
            background: rgba(255, 255, 255, 0.05);
            padding: 3px 8px;
            border-radius: 6px;
            font-family: 'JetBrains Mono', 'Courier New', monospace;
            border: 1px solid var(--border-glass);
        }

        .order-info {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .info-strong {
            color: var(--text-primary);
            font-weight: 600;
        }

        /* ===== ARTICLES SECTION ===== */
        .articles-section {
            margin: 16px 0;
            padding: 14px;
            background: rgba(255, 99, 72, 0.04);
            border: 1px solid rgba(255, 99, 72, 0.1);
            border-radius: var(--radius-md);
        }

        .articles-section h4 {
            color: var(--accent-orange);
            font-size: 11px;
            font-weight: 700;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .article-item {
            font-size: 13px;
            color: var(--text-primary);
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 99, 72, 0.08);
        }

        .article-item:last-child {
            border-bottom: none;
        }

        .article-name {
            font-weight: 600;
            color: var(--text-primary);
        }

        .article-qty {
            font-size: 12px;
            color: var(--text-secondary);
        }

        /* ===== TIMER ===== */
        .timer-display {
            display: none;
            background: rgba(255, 99, 72, 0.1);
            border: 1px solid rgba(255, 99, 72, 0.3);
            color: #ff6348;
            padding: 16px;
            border-radius: 12px;
            margin: 12px 0;
            text-align: center;
            font-size: 36px;
            font-weight: 800;
            font-family: 'JetBrains Mono', 'Courier New', monospace;
            letter-spacing: 4px;
        }

        .timer-display.active {
            display: block;
            animation: glowPulse 2s ease-in-out infinite;
        }

        @keyframes glowPulse {
            0%, 100% { box-shadow: 0 0 20px rgba(255, 99, 72, 0.15); }
            50% { box-shadow: 0 0 40px rgba(255, 99, 72, 0.3); }
        }

        .timer-label {
            font-size: 11px;
            color: rgba(255, 99, 72, 0.7);
            margin-top: 6px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
        }

        /* ===== STATUS BADGE ===== */
        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            margin-top: 10px;
            letter-spacing: 0.5px;
        }

        .status-ready {
            background: rgba(255, 99, 72, 0.1);
            color: var(--accent-orange);
            border: 1px solid rgba(255, 99, 72, 0.2);
        }

        /* ===== ACTION BUTTONS ===== */
        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }

        .btn-start {
            flex: 1;
            background: linear-gradient(135deg, var(--accent-orange), #e55039);
            color: #fff;
            border: none;
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 13px;
            font-weight: 700;
            font-family: inherit;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .btn-start:hover {
            box-shadow: 0 0 25px rgba(255, 99, 72, 0.3), 0 4px 15px rgba(0, 0, 0, 0.3);
            transform: translateY(-2px);
        }

        .btn-start:active {
            transform: translateY(0);
        }

        .btn-start:disabled {
            background: var(--text-muted);
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
            opacity: 0.5;
        }

        .btn-complete {
            flex: 1;
            background: linear-gradient(135deg, var(--accent-green), #00b862);
            color: #000;
            border: none;
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 13px;
            font-weight: 700;
            font-family: inherit;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .btn-complete:hover {
            box-shadow: 0 0 25px rgba(0, 230, 118, 0.3), 0 4px 15px rgba(0, 0, 0, 0.3);
            transform: translateY(-2px);
        }

        .btn-complete:active {
            transform: translateY(0);
        }

        .btn-complete:disabled {
            background: var(--text-muted);
            color: var(--text-secondary);
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
            opacity: 0.5;
        }

        /* Shimmer effect (React Bits inspired) */
        .btn-start::after, .btn-complete::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 50%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.25),
                transparent
            );
            transform: translateX(-200%);
            transition: transform 0s;
        }

        .btn-start:hover:not(:disabled)::after,
        .btn-complete:hover:not(:disabled)::after {
            transform: translateX(400%);
            transition: transform 0.6s ease;
        }

        /* ===== EMPTY STATE ===== */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-lg);
            color: var(--text-secondary);
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.6;
        }

        .empty-state h3 {
            color: var(--text-primary);
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .empty-state p {
            color: var(--text-secondary);
            font-size: 14px;
        }

        /* ===== MODAL OVERLAY ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0; top: 0;
            width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .modal-content {
            background: rgba(17, 24, 39, 0.95);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--border-glass);
            margin: 5% auto;
            padding: 32px;
            border-radius: var(--radius-lg);
            width: 90%;
            max-width: 520px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5), 0 0 40px rgba(255, 99, 72, 0.05);
            animation: fadeInUp 0.3s ease both;
        }

        .modal-content h2 {
            font-size: 20px;
            font-weight: 800;
            color: var(--text-primary);
            margin-bottom: 8px;
            letter-spacing: -0.3px;
        }

        .modal-content > p {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 20px;
        }

        .modal-checkboxes {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-glass);
            padding: 16px;
            border-radius: var(--radius-md);
            margin-bottom: 24px;
            max-height: 300px;
            overflow-y: auto;
        }

        .modal-checkbox-item {
            padding: 12px;
            margin-bottom: 8px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-glass);
            display: flex;
            align-items: center;
            gap: 12px;
            transition: var(--transition);
        }

        .modal-checkbox-item:last-child {
            margin-bottom: 0;
        }

        .modal-checkbox-item:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.1);
        }

        .modal-checkbox-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--accent-orange);
            cursor: pointer;
            flex-shrink: 0;
        }

        .modal-checkbox-item label {
            flex: 1;
            cursor: pointer;
            color: var(--text-primary);
            font-weight: 500;
            font-size: 14px;
        }

        .modal-checkbox-item label strong {
            font-weight: 700;
        }

        .modal-checkbox-item label .qty-info {
            color: var(--text-secondary);
            font-size: 12px;
        }

        .modal-checkbox-item label .completed-tag {
            color: var(--accent-green);
            margin-left: 10px;
            font-size: 12px;
            font-weight: 600;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
        }

        .btn-modal-cancel {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-secondary);
            border: 1px solid var(--border-glass);
            padding: 12px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            font-family: inherit;
            transition: var(--transition);
        }

        .btn-modal-cancel:hover {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-primary);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .btn-modal-confirm {
            flex: 1;
            background: linear-gradient(135deg, var(--accent-green), #00b862);
            color: #000;
            border: none;
            padding: 12px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-weight: 700;
            font-size: 13px;
            font-family: inherit;
            transition: var(--transition);
        }

        .btn-modal-confirm:hover {
            box-shadow: 0 0 20px rgba(0, 230, 118, 0.3);
            transform: translateY(-1px);
        }

        .btn-modal-all {
            flex: 1;
            background: linear-gradient(135deg, var(--accent-orange), #e55039);
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-weight: 700;
            font-size: 13px;
            font-family: inherit;
            transition: var(--transition);
        }

        .btn-modal-all:hover {
            box-shadow: 0 0 20px rgba(255, 99, 72, 0.3);
            transform: translateY(-1px);
        }

        /* ===== ANIMATIONS ===== */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            nav { padding: 0 16px; gap: 4px; }
            nav a { padding: 6px 10px; font-size: 12px; }
            .nav-logo { font-size: 15px; margin-right: 16px; }
            main { padding: 0 16px 40px; }
            .orders-grid { grid-template-columns: 1fr; }
            .summary-box { grid-template-columns: 1fr; }
            .summary-item { border-right: none; border-bottom: 1px solid var(--border-glass); padding: 12px 0; }
            .summary-item:last-child { border-bottom: none; }
            .modal-content { margin: 10% auto; padding: 24px; }
            .modal-buttons { flex-direction: column; }
            .action-buttons { flex-direction: column; }
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }
    </style>
</head>
<body>
    <nav>
        <div class="nav-logo">Schedulatore Laser</div>
        <a href="welcome.html">Caricamento</a>
        <a href="ordini-estratti">Ordini Estratti</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="laser.html">Laser</a>
        <a href="piega.html">Piega</a>
        <a href="saldatura.html" class="active">Saldatura</a>
        <a href="archive.html">Archivio</a>
    </nav>

    <main>
        <div class="page-header">
            <h2>Stazione SALDATURA</h2>
            <p>Articoli in attesa di lavorazione in saldatura</p>
        </div>

        <div id="message" class="message"></div>

        <div class="summary-box">
            <div class="summary-item">
                <div class="summary-number" id="countOrders">0</div>
                <div class="summary-label">Ordini</div>
            </div>
            <div class="summary-item">
                <div class="summary-number" id="countArticles">0</div>
                <div class="summary-label">Articoli</div>
            </div>
            <div class="summary-item">
                <div class="summary-number" id="countPieces">0</div>
                <div class="summary-label">Pezzi Totali</div>
            </div>
        </div>

        <div class="orders-grid" id="ordersContainer"></div>
    </main>

    <!-- MODALE COMPLETAMENTO PARZIALE -->
    <div id="partialCompleteModal" class="modal-overlay">
        <div class="modal-content">
            <h2>Completa Fase SALDATURA</h2>
            <p>Seleziona gli articoli completati per questa fase:</p>

            <div id="articlesCheckboxes" class="modal-checkboxes">
                <!-- Checkbox articoli generati dinamicamente -->
            </div>

            <div class="modal-buttons">
                <button onclick="closePartialModal()" class="btn-modal-cancel">
                    Annulla
                </button>
                <button onclick="submitPartialComplete()" class="btn-modal-confirm">
                    Completa Selezionati
                </button>
                <button onclick="completeAllPartialModal()" class="btn-modal-all" title="Completa tutti gli articoli per questa fase">
                    Completa Tutti
                </button>
            </div>
        </div>
    </div>

    <script>
        // Usa URL relativo per funzionare su localhost e IP
        const API_URL = '/api';
        const PHASE = 'SALDATURA';
        const timers = {}; // Traccia i timer attivi
        const activePhases = {}; // Traccia ordini con fase in corso: { orderId: { startTime, displayTime } }
        let currentOrderForCompletion = null;
        let currentOrderArticles = [];

        // Carica ordini al caricamento
        window.addEventListener('DOMContentLoaded', () => {
            loadOrders();
            // Aggiorna ogni 5 secondi
            setInterval(loadOrders, 5000);
        });

        async function loadOrders() {
            try {
                const response = await fetch(`${API_URL}/phase/${PHASE}/orders`);
                const orders = await response.json();

                renderOrders(Array.isArray(orders) ? orders : []);
                updateSummary(orders);
            } catch (error) {
                console.error('Errore caricamento ordini:', error);
                showMessage('Errore connessione al server', 'error');
            }
        }

        function renderOrders(orders) {
            const container = document.getElementById('ordersContainer');

            if (orders.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">&#10003;</div>
                        <h3>Nessun Lavoro</h3>
                        <p>Non ci sono articoli in attesa per questa fase</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = orders.map(order => {
                const articlesHtml = (order.articles_next_phase || []).map(article => `
                    <div class="article-item">
                        <div class="article-name">${article.name}</div>
                        <div class="article-qty">${article.code ? article.code + ' - ' : ''}${article.qty} pz</div>
                    </div>
                `).join('');

                const totalArticles = order.articles_next_phase ? order.articles_next_phase.length : 0;
                const totalPieces = order.articles_next_phase ? order.articles_next_phase.reduce((sum, a) => sum + a.qty, 0) : 0;

                // Controlla se questo ordine ha un timer attivo
                const isActive = activePhases[order.id];
                const timerDisplay = isActive ? 'display: block;' : 'display: none;';
                const timerValue = isActive ? `<div id="timer-value-${order.id}">${isActive.displayTime}</div>` : `<div id="timer-value-${order.id}">00:00</div>`;
                const startBtnDisabled = isActive ? 'disabled' : '';
                const completeBtnDisabled = isActive ? '' : 'disabled';

                return `
                    <div class="order-card">
                        <div class="order-header">
                            <h3>${order.cliente}</h3>
                            <div class="order-id">${order.id.substring(0, 8)}</div>
                        </div>

                        <div class="order-info">
                            Consegna: <span class="info-strong">${new Date(order.data_consegna).toLocaleDateString('it-IT')}</span>
                        </div>

                        <div class="articles-section">
                            <h4>${totalArticles} Articol${totalArticles !== 1 ? 'i' : 'o'} (${totalPieces} pz)</h4>
                            ${articlesHtml}
                        </div>

                        <div class="timer-display ${isActive ? 'active' : ''}" id="timer-${order.id}" style="${timerDisplay}">
                            ${timerValue}
                            <div class="timer-label">Tempo Lavorazione</div>
                        </div>

                        <span class="status-badge status-ready">Pronto per SALDATURA</span>

                        <div class="action-buttons">
                            <button class="btn-start" id="btn-start-${order.id}" onclick="startPhase('${order.id}')" ${startBtnDisabled}>
                                Inizia
                            </button>
                            <button class="btn-complete" id="btn-complete-${order.id}" onclick="openPartialCompleteModal('${order.id}')" ${completeBtnDisabled}>
                                Completa
                            </button>
                        </div>
                    </div>
                `;
            }).join('');

            // Ripristina i timer per gli ordini attivi
            Object.keys(activePhases).forEach(orderId => {
                const active = activePhases[orderId];
                restoreTimer(orderId, active.startTime);
            });

            // Add spotlight effect to cards
            addSpotlightToCards();
        }

        function addSpotlightToCards() {
            document.querySelectorAll('.order-card').forEach(card => {
                card.addEventListener('mousemove', e => {
                    const rect = card.getBoundingClientRect();
                    card.style.setProperty('--mouse-x', `${e.clientX - rect.left}px`);
                    card.style.setProperty('--mouse-y', `${e.clientY - rect.top}px`);
                });
            });
        }

        async function startPhase(orderId) {
            try {
                const response = await fetch(`${API_URL}/orders/${orderId}/phase/${PHASE}/start`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ operatore: 'Operatore' })
                });

                const data = await response.json();

                if (data.success) {
                    showMessage(`Fase ${PHASE} iniziata`, 'success');

                    // Salva lo stato di questo ordine come attivo
                    activePhases[orderId] = {
                        startTime: Date.now(),
                        displayTime: '00:00'
                    };

                    // Avvia il cronometro
                    startTimer(orderId);

                    // Disabilita il pulsante start e abilita il complete
                    const btnStart = document.getElementById(`btn-start-${orderId}`);
                    const btnComplete = document.getElementById(`btn-complete-${orderId}`);
                    if (btnStart) btnStart.disabled = true;
                    if (btnComplete) btnComplete.disabled = false;

                    // Mostra il timer
                    const timerDisplay = document.getElementById(`timer-${orderId}`);
                    if (timerDisplay) timerDisplay.classList.add('active');
                } else {
                    showMessage('Errore: ' + (data.error || 'Sconosciuto'), 'error');
                }
            } catch (error) {
                showMessage('Errore: ' + error.message, 'error');
            }
        }

        function startTimer(orderId) {
            if (timers[orderId]) {
                clearInterval(timers[orderId]);
            }

            let seconds = 0;
            const timerDisplay = document.getElementById(`timer-${orderId}`);
            const timerValue = document.getElementById(`timer-value-${orderId}`);

            if (timerDisplay) timerDisplay.classList.add('active');

            timers[orderId] = setInterval(() => {
                seconds++;
                const mins = Math.floor(seconds / 60);
                const secs = seconds % 60;
                const display = String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0');
                if (timerValue) timerValue.textContent = display;

                // Aggiorna lo stato per il restore dopo reload
                if (activePhases[orderId]) {
                    activePhases[orderId].displayTime = display;
                }
            }, 1000);
        }

        function restoreTimer(orderId, startTime) {
            if (timers[orderId]) {
                clearInterval(timers[orderId]);
            }

            const timerDisplay = document.getElementById(`timer-${orderId}`);
            const timerValue = document.getElementById(`timer-value-${orderId}`);

            if (!timerDisplay || !timerValue) return;

            timers[orderId] = setInterval(() => {
                const elapsed = Math.floor((Date.now() - startTime) / 1000);
                const mins = Math.floor(elapsed / 60);
                const secs = elapsed % 60;
                const display = String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0');
                timerValue.textContent = display;

                if (activePhases[orderId]) {
                    activePhases[orderId].displayTime = display;
                }
            }, 1000);
        }

        async function openPartialCompleteModal(orderId) {
            try {
                // Ferma il cronometro
                if (timers[orderId]) {
                    clearInterval(timers[orderId]);
                }

                // Recupera dettagli ordine
                const response = await fetch(`${API_URL}/orders/${orderId}`);
                const order = await response.json();

                if (order.error) {
                    showMessage('Errore caricamento dettagli ordine', 'error');
                    return;
                }

                currentOrderForCompletion = orderId;
                currentOrderArticles = order.articles || [];

                // Genera checkbox per articoli
                const checkboxesDiv = document.getElementById('articlesCheckboxes');
                checkboxesDiv.innerHTML = currentOrderArticles.map((article, idx) => {
                    const isCompleted = article.completed_phases && article.completed_phases.includes(PHASE);
                    const disabled = isCompleted ? 'disabled' : '';
                    const checkedAttr = isCompleted ? 'checked' : '';

                    return `
                        <div class="modal-checkbox-item">
                            <input type="checkbox" id="article_${idx}" ${checkedAttr} ${disabled}>
                            <label for="article_${idx}">
                                <strong>${article.name}</strong>
                                <span class="qty-info">(${article.qty} pz)</span>
                                ${isCompleted ? '<span class="completed-tag">Completato</span>' : ''}
                            </label>
                        </div>
                    `;
                }).join('');

                // Mostra modale
                document.getElementById('partialCompleteModal').style.display = 'block';
            } catch (error) {
                showMessage('Errore: ' + error.message, 'error');
            }
        }

        function closePartialModal() {
            document.getElementById('partialCompleteModal').style.display = 'none';
            currentOrderForCompletion = null;
            currentOrderArticles = [];
        }

        async function submitPartialComplete() {
            if (!currentOrderForCompletion) return;

            // Recupera checkbox selezionati
            const selectedIndices = [];
            currentOrderArticles.forEach((_, idx) => {
                const checkbox = document.getElementById(`article_${idx}`);
                if (checkbox && checkbox.checked && !checkbox.disabled) {
                    selectedIndices.push(idx);
                }
            });

            if (selectedIndices.length === 0) {
                showMessage('Seleziona almeno un articolo', 'error');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/orders/${currentOrderForCompletion}/phase/${PHASE}/complete-partial`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        article_indices: selectedIndices,
                        note: ''
                    })
                });

                const data = await response.json();

                if (data.success) {
                    const msg = data.phase_complete
                        ? `Fase ${PHASE} completata!`
                        : `${selectedIndices.length} articolo/i completato/i`;
                    showMessage(msg, 'success');

                    // HOTFIX v1.2.1: Se il completamento è PARZIALE (non tutti gli articoli), ferma il timer
                    if (!data.phase_complete && activePhases[currentOrderForCompletion]) {
                        if (timers[currentOrderForCompletion]) {
                            clearInterval(timers[currentOrderForCompletion]);
                        }
                        activePhases[currentOrderForCompletion] = null;
                    }

                    closePartialModal();
                    await loadOrders();
                } else {
                    showMessage('Errore: ' + (data.error || 'Sconosciuto'), 'error');
                }
            } catch (error) {
                showMessage('Errore: ' + error.message, 'error');
            }
        }

        async function completeAllPartialModal() {
            if (!currentOrderForCompletion) return;

            // Seleziona tutti gli articoli non completati
            currentOrderArticles.forEach((_, idx) => {
                const checkbox = document.getElementById(`article_${idx}`);
                if (checkbox && !checkbox.disabled) {
                    checkbox.checked = true;
                }
            });

            // Invia il completamento
            await submitPartialComplete();
        }

        function updateSummary(orders) {
            const totalOrders = orders.length;
            let totalArticles = 0;
            let totalPieces = 0;

            orders.forEach(order => {
                const articlesForPhase = order.articles_next_phase || [];
                totalArticles += articlesForPhase.length;
                totalPieces += articlesForPhase.reduce((sum, a) => sum + a.qty, 0);
            });

            document.getElementById('countOrders').textContent = totalOrders;
            document.getElementById('countArticles').textContent = totalArticles;
            document.getElementById('countPieces').textContent = totalPieces;
        }

        function showMessage(msg, type) {
            const msgBox = document.getElementById('message');
            msgBox.textContent = msg;
            msgBox.className = `message ${type}`;

            setTimeout(() => {
                msgBox.className = 'message';
            }, 5000);
        }
    </script>
</body>
</html>
