<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stazione Saldatura - Schedulatore Laser</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #111827;
            --bg-card: rgba(255, 255, 255, 0.03);
            --bg-card-hover: rgba(255, 255, 255, 0.06);
            --bg-input: rgba(255, 255, 255, 0.05);
            --border-glass: rgba(255, 255, 255, 0.06);
            --border-hover: rgba(0, 212, 255, 0.3);
            --text-primary: #e6e6e6;
            --text-secondary: #6b7b8d;
            --text-muted: #4a5568;
            --accent-cyan: #00d4ff;
            --accent-green: #00e676;
            --accent-red: #ff4757;
            --accent-amber: #ffa502;
            --accent-orange: #ff6348;
            --accent-purple: #a855f7;
            --radius-lg: 16px;
            --radius-md: 12px;
            --radius-sm: 8px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Ambient background — orange tint for saldatura */
        body::before {
            content: '';
            position: fixed;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background:
                radial-gradient(circle at 20% 50%, rgba(255, 99, 72, 0.04) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(168, 85, 247, 0.03) 0%, transparent 50%),
                radial-gradient(circle at 50% 80%, rgba(255, 165, 2, 0.02) 0%, transparent 50%);
            animation: ambientFloat 25s ease-in-out infinite;
            z-index: 0;
            pointer-events: none;
        }

        @keyframes ambientFloat {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(2%, -1%) rotate(1deg); }
            66% { transform: translate(-1%, 2%) rotate(-1deg); }
        }

        /* ===== NAVBAR ===== */
        nav {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 64px;
            background: rgba(10, 10, 15, 0.8);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-bottom: 1px solid var(--border-glass);
            display: flex;
            align-items: center;
            padding: 0 24px;
            gap: 6px;
            z-index: 1000;
        }

        .nav-logo {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-green));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-right: 32px;
            white-space: nowrap;
        }

        nav a {
            color: var(--text-secondary);
            text-decoration: none;
            padding: 8px 16px;
            border-radius: var(--radius-sm);
            transition: var(--transition);
            font-size: 13px;
            font-weight: 500;
            white-space: nowrap;
            position: relative;
        }

        nav a:hover {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.05);
        }

        nav a.active {
            color: var(--accent-orange);
            background: rgba(255, 99, 72, 0.1);
            font-weight: 600;
            box-shadow: 0 0 20px rgba(255, 99, 72, 0.1);
        }

        /* ===== MAIN ===== */
        main {
            position: relative;
            z-index: 1;
            margin-top: 88px;
            padding: 0 24px 60px;
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
        }

        /* ===== PAGE HEADER ===== */
        .page-header {
            margin-bottom: 32px;
            animation: fadeInUp 0.6s ease both;
        }

        .page-header h2 {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, var(--accent-orange), #ff8c42);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        .page-header p {
            color: var(--text-secondary);
            font-size: 14px;
        }

        /* ===== MESSAGES ===== */
        .message {
            padding: 14px 20px;
            border-radius: var(--radius-sm);
            margin-bottom: 20px;
            display: none;
            font-size: 14px;
            font-weight: 500;
            animation: fadeInUp 0.3s ease both;
            backdrop-filter: blur(10px);
        }

        .message.success {
            background: rgba(0, 230, 118, 0.1);
            color: var(--accent-green);
            border: 1px solid rgba(0, 230, 118, 0.2);
            display: block;
        }

        .message.error {
            background: rgba(255, 71, 87, 0.1);
            color: var(--accent-red);
            border: 1px solid rgba(255, 71, 87, 0.2);
            display: block;
        }

        .message.info {
            background: rgba(255, 99, 72, 0.1);
            color: var(--accent-orange);
            border: 1px solid rgba(255, 99, 72, 0.2);
            display: block;
        }

        /* ===== SUMMARY STATS ===== */
        .summary-box {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 32px;
            animation: fadeInUp 0.6s ease both;
            animation-delay: 0.1s;
        }

        .summary-item {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-lg);
            padding: 24px;
            text-align: center;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .summary-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-orange), transparent);
            opacity: 0.5;
        }

        .summary-item:hover {
            background: var(--bg-card-hover);
            border-color: rgba(255, 99, 72, 0.2);
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(255, 99, 72, 0.08);
        }

        .summary-number {
            font-size: 36px;
            font-weight: 800;
            color: var(--accent-orange);
            line-height: 1;
            margin-bottom: 8px;
            font-variant-numeric: tabular-nums;
        }

        .summary-label {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        /* ===== ORDERS GRID ===== */
        .orders-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 20px;
            animation: fadeInUp 0.6s ease both;
            animation-delay: 0.2s;
        }

        /* ===== ORDER CARD ===== */
        .order-card {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-glass);
            border-top: 2px solid rgba(255, 99, 72, 0.5);
            border-radius: var(--radius-lg);
            padding: 24px;
            transition: var(--transition);
            position: relative;
            animation: fadeInUp 0.5s ease both;
        }

        .order-card:hover {
            background: var(--bg-card-hover);
            border-color: rgba(255, 255, 255, 0.1);
            border-top-color: rgba(255, 99, 72, 0.8);
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3), 0 0 30px rgba(255, 99, 72, 0.08);
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .order-card h3 {
            color: var(--text-primary);
            font-size: 16px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .order-card h3::before {
            content: '';
            width: 3px;
            height: 16px;
            background: var(--accent-orange);
            border-radius: 2px;
            box-shadow: 0 0 8px var(--accent-orange);
            flex-shrink: 0;
        }

        .order-id {
            font-size: 11px;
            color: var(--text-muted);
            background: rgba(255, 255, 255, 0.05);
            padding: 3px 8px;
            border-radius: 6px;
            font-family: 'JetBrains Mono', 'Courier New', monospace;
            border: 1px solid var(--border-glass);
        }

        .order-info {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .info-strong {
            color: var(--text-primary);
            font-weight: 600;
        }

        /* ===== ARTICLES SECTION ===== */
        .articles-section {
            margin: 16px 0;
            padding: 14px;
            background: rgba(255, 99, 72, 0.04);
            border: 1px solid rgba(255, 99, 72, 0.1);
            border-radius: var(--radius-md);
        }

        .articles-section h4 {
            color: var(--accent-orange);
            font-size: 11px;
            font-weight: 700;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .article-item {
            font-size: 13px;
            color: var(--text-primary);
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .article-item:last-child {
            border-bottom: none;
        }

        .article-name {
            font-weight: 600;
            color: var(--text-primary);
        }

        .article-qty {
            font-size: 12px;
            color: var(--text-secondary);
        }

        /* ===== TIMER DISPLAY ===== */
        .timer-display {
            display: none;
            background: rgba(255, 99, 72, 0.1);
            border: 1px solid rgba(255, 99, 72, 0.3);
            color: #ff6348;
            padding: 16px;
            border-radius: 12px;
            margin: 12px 0;
            text-align: center;
            font-size: 36px;
            font-weight: 800;
            font-family: 'JetBrains Mono', 'Courier New', monospace;
            letter-spacing: 4px;
        }

        .timer-display.active {
            display: block;
            animation: glowPulse 2s ease-in-out infinite;
        }

        @keyframes glowPulse {
            0%, 100% { box-shadow: 0 0 20px rgba(255, 99, 72, 0.15); }
            50% { box-shadow: 0 0 40px rgba(255, 99, 72, 0.3); }
        }

        .timer-label {
            font-size: 11px;
            color: rgba(255, 99, 72, 0.7);
            margin-top: 6px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
        }

        /* ===== STATUS BADGE ===== */
        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            margin-top: 10px;
            letter-spacing: 0.5px;
        }

        .status-ready {
            background: rgba(255, 99, 72, 0.1);
            color: var(--accent-orange);
            border: 1px solid rgba(255, 99, 72, 0.2);
        }

        .status-started {
            background: rgba(0, 212, 255, 0.1);
            color: var(--accent-cyan);
            border: 1px solid rgba(0, 212, 255, 0.2);
        }

        /* ===== ACTION BUTTONS ===== */
        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }

        .btn-complete {
            flex: 1;
            background: linear-gradient(135deg, var(--accent-green), #00b862);
            color: #000;
            border: none;
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 13px;
            font-weight: 700;
            font-family: inherit;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .btn-complete:hover {
            box-shadow: 0 0 25px rgba(0, 230, 118, 0.3), 0 4px 15px rgba(0, 0, 0, 0.3);
            transform: translateY(-2px);
        }

        .btn-complete:active {
            transform: translateY(0);
        }

        .btn-complete:disabled {
            background: var(--text-muted);
            color: var(--text-secondary);
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
            opacity: 0.5;
        }

        /* ===== EMPTY STATE ===== */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-lg);
            color: var(--text-secondary);
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.6;
        }

        .empty-state h3 {
            color: var(--text-primary);
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .empty-state p {
            color: var(--text-secondary);
            font-size: 14px;
        }

        /* ===== MODAL OVERLAY ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0; top: 0;
            width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .modal-overlay.show {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: rgba(17, 24, 39, 0.95);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--border-glass);
            padding: 32px;
            border-radius: var(--radius-lg);
            width: 90%;
            max-width: 520px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5), 0 0 40px rgba(255, 99, 72, 0.05);
            animation: fadeInUp 0.3s ease both;
            position: relative;
            overflow: hidden;
        }

        .modal-content::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-orange), transparent);
        }

        .modal-title {
            font-size: 20px;
            font-weight: 800;
            color: var(--text-primary);
            margin-bottom: 8px;
            letter-spacing: -0.3px;
        }

        .modal-subtitle {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 20px;
        }

        .modal-checkboxes {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-glass);
            padding: 8px;
            border-radius: var(--radius-md);
            margin-bottom: 24px;
            max-height: 300px;
            overflow-y: auto;
        }

        .modal-checkbox-item {
            padding: 12px;
            margin-bottom: 8px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-glass);
            display: flex;
            align-items: center;
            gap: 12px;
            transition: var(--transition);
            cursor: pointer;
        }

        .modal-checkbox-item:last-child {
            margin-bottom: 0;
        }

        .modal-checkbox-item:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.1);
        }

        .modal-checkbox-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--accent-orange);
            cursor: pointer;
            flex-shrink: 0;
        }

        .modal-checkbox-item label {
            flex: 1;
            cursor: pointer;
            color: var(--text-primary);
            font-weight: 500;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .modal-checkbox-item label .qty-tag {
            color: var(--text-secondary);
            font-size: 12px;
        }

        .modal-checkbox-item label .completed-tag {
            color: var(--accent-green);
            margin-left: auto;
            font-size: 11px;
            font-weight: 600;
            background: rgba(0, 230, 118, 0.1);
            padding: 2px 8px;
            border-radius: 4px;
        }

        .modal-checkbox-item.is-completed {
            opacity: 0.6;
        }

        /* Badge "Seleziona Tutti" nel modale */
        .btn-modal-select-all {
            background: rgba(0, 212, 255, 0.1);
            color: var(--accent-cyan);
            border: 1px solid rgba(0, 212, 255, 0.2);
            padding: 6px 14px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            font-family: inherit;
            transition: var(--transition);
            margin-bottom: 12px;
        }

        .btn-modal-select-all:hover {
            background: rgba(0, 212, 255, 0.15);
            border-color: rgba(0, 212, 255, 0.3);
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
        }

        .btn-modal-cancel {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-secondary);
            border: 1px solid var(--border-glass);
            padding: 12px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            font-family: inherit;
            transition: var(--transition);
        }

        .btn-modal-cancel:hover {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-primary);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .btn-modal-confirm {
            flex: 1;
            background: linear-gradient(135deg, var(--accent-green), #00b862);
            color: #000;
            border: none;
            padding: 12px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-weight: 700;
            font-size: 13px;
            font-family: inherit;
            transition: var(--transition);
        }

        .btn-modal-confirm:hover {
            box-shadow: 0 0 20px rgba(0, 230, 118, 0.3);
            transform: translateY(-1px);
        }

        /* ===== STATI ARTICOLO PER-FASE (v1.1+) ===== */
        .article-status-attesa {
            color: var(--text-secondary);
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .article-status-lavorazione {
            color: var(--accent-cyan);
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .article-status-lavorazione::before {
            content: '';
            display: inline-block;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--accent-cyan);
            box-shadow: 0 0 6px var(--accent-cyan);
            animation: pulse-dot 1.5s ease-in-out infinite;
            flex-shrink: 0;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.7); }
        }

        .article-status-completato {
            color: var(--accent-green);
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            opacity: 0.5;
        }

        /* Articolo completato nella fase: dimmed */
        .article-item.completato {
            opacity: 0.45;
        }

        /* Pulsante "Avvia Tutti" */
        .btn-avvia {
            flex: 1;
            background: linear-gradient(135deg, var(--accent-orange), #e55039);
            color: #fff;
            border: none;
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 13px;
            font-weight: 700;
            font-family: inherit;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .btn-avvia:hover {
            box-shadow: 0 0 25px rgba(255, 99, 72, 0.3), 0 4px 15px rgba(0, 0, 0, 0.3);
            transform: translateY(-2px);
        }

        .btn-avvia:active {
            transform: translateY(0);
        }

        .btn-avvia:disabled {
            background: var(--text-muted);
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
            opacity: 0.5;
        }

        /* ===== ANIMATIONS ===== */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            nav { padding: 0 16px; gap: 4px; }
            nav a { padding: 6px 10px; font-size: 12px; }
            .nav-logo { font-size: 15px; margin-right: 16px; }
            main { padding: 0 16px 40px; }
            .orders-grid { grid-template-columns: 1fr; }
            .summary-box { grid-template-columns: 1fr; }
            .modal-content { padding: 24px; }
            .modal-buttons { flex-direction: column; }
            .action-buttons { flex-direction: column; }
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }
    </style>
</head>
<body>
    <nav>
        <div class="nav-logo">Schedulatore Laser</div>
        <a href="welcome.html">Caricamento</a>
        <a href="ordini-estratti">Ordini Estratti</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="laser.html">Laser</a>
        <a href="piega.html">Piega</a>
        <a href="saldatura.html" class="active">Saldatura</a>
        <a href="archive.html">Archivio</a>
    </nav>

    <main>
        <div class="page-header">
            <h2>Stazione SALDATURA</h2>
            <p>Articoli in attesa di lavorazione in saldatura</p>
        </div>

        <div id="message" class="message"></div>

        <div class="summary-box">
            <div class="summary-item">
                <div class="summary-number" id="countOrders">0</div>
                <div class="summary-label">Ordini</div>
            </div>
            <div class="summary-item">
                <div class="summary-number" id="countArticles">0</div>
                <div class="summary-label">Articoli</div>
            </div>
            <div class="summary-item">
                <div class="summary-number" id="countPieces">0</div>
                <div class="summary-label">Pezzi Totali</div>
            </div>
        </div>

        <div class="orders-grid" id="ordersContainer"></div>
    </main>

    <!-- MODALE COMPLETAMENTO PARZIALE -->
    <div id="partialCompleteModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-title">Completa Fase SALDATURA</div>
            <p class="modal-subtitle">Seleziona gli articoli completati per questa fase:</p>

            <button class="btn-modal-select-all" onclick="selectAllModalCheckboxes()">
                Seleziona Tutti
            </button>

            <div id="articlesCheckboxes" class="modal-checkboxes">
                <!-- Checkbox articoli generati dinamicamente -->
            </div>

            <div class="modal-buttons">
                <button onclick="closePartialModal()" class="btn-modal-cancel">
                    Annulla
                </button>
                <button onclick="submitPartialComplete()" class="btn-modal-confirm">
                    Completa Selezionati
                </button>
            </div>
        </div>
    </div>

    <script>
        // Usa URL relativo per funzionare su localhost e IP
        const API_URL = '/api';
        const PHASE = 'SALDATURA';

        // Timer e stato attivo per ordine
        const timers = {};
        const activePhases = {}; // { orderId: { startTime, displayTime } }

        // Stato modale completamento parziale
        let currentOrderForCompletion = null;
        let currentOrderArticles = [];  // articoli dalla risposta articles_in_phase (con article_id UUID)

        // Carica ordini al caricamento
        window.addEventListener('DOMContentLoaded', () => {
            loadOrders();
            // Aggiorna ogni 5 secondi
            setInterval(loadOrders, 5000);
        });

        async function loadOrders() {
            try {
                const response = await fetch(`${API_URL}/phase/${PHASE}/orders`);
                const orders = await response.json();
                const orderList = Array.isArray(orders) ? orders : [];

                renderOrders(orderList);
                updateSummary(orderList);
            } catch (error) {
                console.error('Errore caricamento ordini:', error);
                showMessage('Errore connessione al server', 'error');
            }
        }

        // Restituisce il badge HTML per lo stato articolo
        function articleStatusBadge(status) {
            if (status === 'in_lavorazione') {
                return '<span class="article-status-lavorazione">In lavorazione</span>';
            } else if (status === 'completato') {
                return '<span class="article-status-completato">Completato</span>';
            } else {
                return '<span class="article-status-attesa">In attesa</span>';
            }
        }

        function renderOrders(orders) {
            const container = document.getElementById('ordersContainer');

            // Filtra ordini che abbiano almeno un articolo non completato
            const activeOrders = orders.filter(order =>
                (order.articles_in_phase || []).some(a => a.phase_status !== 'completato')
            );

            if (activeOrders.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">&#10003;</div>
                        <h3>Nessun Lavoro</h3>
                        <p>Non ci sono articoli in attesa per questa fase</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = activeOrders.map(order => {
                const articles = order.articles_in_phase || [];

                const articlesHtml = articles.map(article => {
                    const isCompletato = article.phase_status === 'completato';
                    const itemClass = isCompletato ? ' completato' : '';
                    return `
                        <div class="article-item${itemClass}">
                            <span>
                                <span class="article-name">${escapeHtml(article.name)}</span>
                                <span class="article-qty"> — ${article.code ? article.code + ' · ' : ''}${article.qty} pz</span>
                            </span>
                            ${articleStatusBadge(article.phase_status)}
                        </div>
                    `;
                }).join('');

                // Conteggi escludendo i completati (per riepilogo card)
                const pendingArticles = articles.filter(a => a.phase_status !== 'completato');
                const totalArticles = pendingArticles.length;
                const totalPieces = pendingArticles.reduce((sum, a) => sum + (a.qty || 0), 0);

                // Stato card: almeno uno in lavorazione?
                const hasActive = articles.some(a => a.phase_status === 'in_lavorazione');
                const allActive = articles.filter(a => a.phase_status !== 'completato').every(a => a.phase_status === 'in_lavorazione');
                const statusBadgeHtml = hasActive
                    ? '<span class="status-badge status-started">In Lavorazione</span>'
                    : '<span class="status-badge status-ready">In Attesa</span>';

                // Pulsante "Avvia Tutti": disabilitato se tutti già in lavorazione
                const avviaDisabled = allActive ? 'disabled' : '';
                const avviaTitle = allActive ? 'Tutti gli articoli sono già in lavorazione' : 'Avvia tutti gli articoli in attesa';

                // JSON articoli in_attesa per la callback "Avvia Tutti"
                const attesaArticles = articles.filter(a => a.phase_status === 'in_attesa');
                const attesaJson = JSON.stringify(attesaArticles).replace(/"/g, '&quot;');

                // Stato timer per questo ordine
                const isTimerActive = !!activePhases[order.id];
                const timerValue = isTimerActive ? activePhases[order.id].displayTime : '00:00';

                return `
                    <div class="order-card">
                        <div class="order-header">
                            <h3>${escapeHtml(order.cliente)}</h3>
                            <div class="order-id">${order.id.substring(0, 8)}</div>
                        </div>

                        <div class="order-info">
                            Consegna: <span class="info-strong">${new Date(order.data_consegna).toLocaleDateString('it-IT')}</span>
                        </div>

                        <div class="articles-section">
                            <h4>${totalArticles} Articol${totalArticles !== 1 ? 'i' : 'o'} in attesa (${totalPieces} pz)</h4>
                            ${articlesHtml}
                        </div>

                        <div class="timer-display ${isTimerActive ? 'active' : ''}" id="timer-${order.id}">
                            <div id="timer-value-${order.id}">${timerValue}</div>
                            <div class="timer-label">Tempo Lavorazione</div>
                        </div>

                        ${statusBadgeHtml}

                        <div class="action-buttons">
                            <button class="btn-avvia" ${avviaDisabled} title="${avviaTitle}"
                                onclick="avviaTutti('${order.id}', '${attesaJson.replace(/'/g, "&#39;")}')">
                                Avvia Tutti
                            </button>
                            <button class="btn-complete" onclick="openPartialCompleteModal('${order.id}', ${JSON.stringify(articles).replace(/"/g, '&quot;')})">
                                Completa
                            </button>
                        </div>
                    </div>
                `;
            }).join('');

            // Ripristina i timer per gli ordini attivi dopo il re-render
            Object.keys(activePhases).forEach(orderId => {
                const active = activePhases[orderId];
                restoreTimer(orderId, active.startTime);
            });
        }

        // Avvia tutti gli articoli in_attesa per un ordine (per-articolo, sequenzialmente) + timer
        async function avviaTutti(orderId, articlesJson) {
            let attesaArticles;
            try {
                attesaArticles = JSON.parse(articlesJson.replace(/&#39;/g, "'"));
            } catch (e) {
                showMessage('Errore parsing articoli', 'error');
                return;
            }

            if (!attesaArticles || attesaArticles.length === 0) {
                showMessage('Nessun articolo in attesa da avviare', 'info');
                return;
            }

            let avviati = 0;
            for (const article of attesaArticles) {
                if (!article.article_id) continue;
                try {
                    const response = await fetch(`${API_URL}/orders/${orderId}/phase/${PHASE}/start`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ article_id: article.article_id, operatore: '' })
                    });
                    const data = await response.json();
                    if (data.success) avviati++;
                } catch (e) {
                    console.error('Errore avvio articolo', article.article_id, e);
                }
            }

            if (avviati > 0) {
                // Avvia il timer per questo ordine
                if (!activePhases[orderId]) {
                    activePhases[orderId] = {
                        startTime: Date.now(),
                        displayTime: '00:00'
                    };
                    startTimer(orderId);
                }
                showMessage(`Fase ${PHASE} avviata per ${avviati} articol${avviati !== 1 ? 'i' : 'o'}`, 'success');
                await loadOrders();
            } else {
                showMessage('Nessun articolo avviato', 'error');
            }
        }

        function startTimer(orderId) {
            if (timers[orderId]) {
                clearInterval(timers[orderId]);
            }

            const timerDisplay = document.getElementById(`timer-${orderId}`);
            const timerValue = document.getElementById(`timer-value-${orderId}`);

            if (timerDisplay) timerDisplay.classList.add('active');

            let seconds = 0;
            timers[orderId] = setInterval(() => {
                seconds++;
                const mins = Math.floor(seconds / 60);
                const secs = seconds % 60;
                const display = String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0');
                if (timerValue) timerValue.textContent = display;

                // Aggiorna lo stato per il restore dopo reload
                if (activePhases[orderId]) {
                    activePhases[orderId].displayTime = display;
                }
            }, 1000);
        }

        function restoreTimer(orderId, startTime) {
            if (timers[orderId]) {
                clearInterval(timers[orderId]);
            }

            const timerDisplay = document.getElementById(`timer-${orderId}`);
            const timerValue = document.getElementById(`timer-value-${orderId}`);

            if (!timerDisplay || !timerValue) return;

            timerDisplay.classList.add('active');

            timers[orderId] = setInterval(() => {
                const elapsed = Math.floor((Date.now() - startTime) / 1000);
                const mins = Math.floor(elapsed / 60);
                const secs = elapsed % 60;
                const display = String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0');
                timerValue.textContent = display;

                if (activePhases[orderId]) {
                    activePhases[orderId].displayTime = display;
                }
            }, 1000);
        }

        // Apre il modale di completamento parziale usando i dati articles_in_phase (UUID)
        // Ferma il timer quando si apre il modale
        async function openPartialCompleteModal(orderId, articlesParam) {
            // Ferma il cronometro quando si apre il modale
            if (timers[orderId]) {
                clearInterval(timers[orderId]);
            }

            let articles;
            if (typeof articlesParam === 'string') {
                try {
                    articles = JSON.parse(articlesParam.replace(/&#39;/g, "'"));
                } catch (e) {
                    articles = null;
                }
            } else if (Array.isArray(articlesParam)) {
                articles = articlesParam;
            }

            // Se non abbiamo i dati, li recuperiamo dal server
            if (!articles) {
                try {
                    const response = await fetch(`${API_URL}/phase/${PHASE}/orders`);
                    const orders = await response.json();
                    const order = (orders || []).find(o => o.id === orderId);
                    articles = order ? (order.articles_in_phase || []) : [];
                } catch (e) {
                    showMessage('Errore caricamento articoli', 'error');
                    return;
                }
            }

            currentOrderForCompletion = orderId;
            currentOrderArticles = articles;

            // Genera checkbox per articoli (usa article_id UUID)
            const checkboxesDiv = document.getElementById('articlesCheckboxes');
            checkboxesDiv.innerHTML = articles.map((article, idx) => {
                const isCompleted = article.phase_status === 'completato';
                const disabled = isCompleted ? 'disabled' : '';
                const checkedAttr = isCompleted ? 'checked' : '';
                const completedClass = isCompleted ? ' is-completed' : '';
                const statusBadge = isCompleted
                    ? '<span class="completed-tag">Completato</span>'
                    : (article.phase_status === 'in_lavorazione'
                        ? '<span style="color: var(--accent-cyan); font-size: 11px; margin-left: auto;">In lavorazione</span>'
                        : '');

                return `
                    <div class="modal-checkbox-item${completedClass}">
                        <input type="checkbox" id="article_cb_${idx}"
                            data-article-id="${article.article_id || ''}"
                            ${checkedAttr} ${disabled}>
                        <label for="article_cb_${idx}">
                            <strong>${escapeHtml(article.name)}</strong>
                            <span class="qty-tag">(${article.qty} pz)</span>
                            ${statusBadge}
                        </label>
                    </div>
                `;
            }).join('');

            // Mostra modale
            document.getElementById('partialCompleteModal').classList.add('show');
        }

        function selectAllModalCheckboxes() {
            currentOrderArticles.forEach((_, idx) => {
                const checkbox = document.getElementById(`article_cb_${idx}`);
                if (checkbox && !checkbox.disabled) {
                    checkbox.checked = true;
                }
            });
        }

        function closePartialModal() {
            document.getElementById('partialCompleteModal').classList.remove('show');
            // Riprende il timer se l'ordine era ancora attivo
            if (currentOrderForCompletion && activePhases[currentOrderForCompletion]) {
                restoreTimer(currentOrderForCompletion, activePhases[currentOrderForCompletion].startTime);
            }
            currentOrderForCompletion = null;
            currentOrderArticles = [];
        }

        async function submitPartialComplete() {
            if (!currentOrderForCompletion) return;

            // Recupera UUID degli articoli selezionati
            const selectedIds = [];
            currentOrderArticles.forEach((article, idx) => {
                const checkbox = document.getElementById(`article_cb_${idx}`);
                if (checkbox && checkbox.checked && !checkbox.disabled) {
                    const articleId = checkbox.getAttribute('data-article-id');
                    if (articleId) selectedIds.push(articleId);
                }
            });

            if (selectedIds.length === 0) {
                showMessage('Seleziona almeno un articolo', 'error');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/orders/${currentOrderForCompletion}/phase/${PHASE}/complete-partial`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        article_ids: selectedIds,
                        note: ''
                    })
                });

                const data = await response.json();

                if (data.success) {
                    const n = selectedIds.length;
                    const msg = data.phase_complete
                        ? `Fase ${PHASE} completata per tutti gli articoli!`
                        : `${n} articolo${n !== 1 ? '/i' : ''} completato${n !== 1 ? '/i' : ''}`;
                    showMessage(msg, 'success');
                    // Ferma il timer all'invio
                    if (currentOrderForCompletion && timers[currentOrderForCompletion]) {
                        clearInterval(timers[currentOrderForCompletion]);
                    }
                    delete activePhases[currentOrderForCompletion];
                    // Chiudi modale senza riprendere il timer
                    document.getElementById('partialCompleteModal').classList.remove('show');
                    currentOrderForCompletion = null;
                    currentOrderArticles = [];
                    await loadOrders();
                } else {
                    showMessage('Errore: ' + (data.error || 'Sconosciuto'), 'error');
                }
            } catch (error) {
                showMessage('Errore: ' + error.message, 'error');
            }
        }

        function updateSummary(orders) {
            const totalOrders = orders.length;
            let totalArticles = 0;
            let totalPieces = 0;

            orders.forEach(order => {
                // Conta solo gli articoli non completati nella fase
                const articlesInPhase = (order.articles_in_phase || []).filter(
                    a => a.phase_status !== 'completato'
                );
                totalArticles += articlesInPhase.length;
                totalPieces += articlesInPhase.reduce((sum, a) => sum + (a.qty || 0), 0);
            });

            document.getElementById('countOrders').textContent = totalOrders;
            document.getElementById('countArticles').textContent = totalArticles;
            document.getElementById('countPieces').textContent = totalPieces;
        }

        function showMessage(msg, type) {
            const msgBox = document.getElementById('message');
            msgBox.textContent = msg;
            msgBox.className = `message ${type}`;

            setTimeout(() => {
                msgBox.className = 'message';
            }, 5000);
        }

        // Escape HTML per prevenire XSS
        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        // Chiudi modale cliccando sull'overlay
        document.getElementById('partialCompleteModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closePartialModal();
            }
        });

        // Chiudi modale con Escape
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closePartialModal();
            }
        });
    </script>
</body>
</html>
