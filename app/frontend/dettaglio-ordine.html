<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LS FerroTrack — Dettaglio Ordine</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body { animation: pageIn 0.3s ease-out; }
body.page-exit { animation: pageOut 0.15s ease-in forwards; }
@keyframes pageIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes pageOut { from { opacity: 1; } to { opacity: 0; } }

:root {
  --ls-green: #1a7a48;
  --ls-green-light: #22a060;
  --bg: #fafafa;
  --white: #ffffff;
  --black: #000000;
  --gray-text: #666666;
  --border: #e5e5e5;
  --orange: #f97316;
  --blue: #3b82f6;
  --purple: #8b5cf6;
  --green-light: #22c55e;
  --green-badge-bg: #dcfce7;
  --orange-bg: #fef3c7;
}

body {
  font-family: 'Inter', sans-serif;
  background: var(--white);
  color: var(--black);
  -webkit-font-smoothing: antialiased;
}

/* TOPBAR */
.topbar {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 64px;
  background: var(--white);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 48px; z-index: 1000;
}

.logo-section {
  display: flex; align-items: center; gap: 12px;
  text-decoration: none; color: inherit; cursor: pointer; transition: opacity 0.2s;
}
.logo-section:hover { opacity: 0.8; }

.logo-icon {
  width: 40px; height: 40px;
  display: flex; align-items: center; justify-content: center;
}
.logo-icon img {
  width: 40px; height: 40px;
  object-fit: contain;
}

.logo-text { display: flex; flex-direction: column; gap: 1px; }
.logo-main { font-family: 'Geist', sans-serif; font-size: 15px; font-weight: 900; letter-spacing: -0.5px; }
.logo-sub { font-size: 10px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: var(--ls-green); }

.topbar-actions { display: flex; align-items: center; gap: 12px; }

.btn-home {
  background: var(--ls-green); color: white; border: none;
  padding: 8px 16px; border-radius: 6px; font-size: 13px; font-weight: 600;
  cursor: pointer; transition: opacity 0.2s;
}
.btn-home:hover { opacity: 0.9; }

.btn-logout {
  background: var(--white); border: 1px solid var(--border);
  padding: 8px 16px; border-radius: 6px; font-size: 13px;
  cursor: pointer; transition: all 0.2s;
}
.btn-logout:hover { background: var(--bg); }

/* MAIN AREA */
.main-area {
  margin-top: 64px;
  display: flex;
  height: calc(100vh - 64px);
}

/* LEFT COLUMN */
.left-col {
  flex: 1;
  background: #f8fafc;
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  overflow-y: auto;
}

.back-link {
  display: flex; align-items: center; gap: 12px;
  font-size: 14px; font-weight: 600;
  cursor: pointer; color: var(--black);
  text-decoration: none;
  transition: color 0.2s;
}
.back-link:hover { color: var(--ls-green); }

.pdf-viewer {
  flex: 1;
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  min-height: 400px;
}

.pdf-info {
  padding: 12px 16px;
  display: flex; align-items: center; gap: 12px;
  border-bottom: 1px solid var(--border);
  font-size: 14px;
}

.pdf-info-sub {
  font-size: 12px;
  color: var(--gray-text);
}

.pdf-iframe {
  flex: 1;
  border: none;
  width: 100%;
}

.dxf-row {
  display: flex; gap: 8px; flex-wrap: wrap;
}

.dxf-btn {
  display: flex; align-items: center; gap: 6px;
  padding: 8px 12px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--white);
  font-size: 12px;
  text-decoration: none;
  color: var(--black);
  transition: border-color 0.2s;
}
.dxf-btn:hover { border-color: var(--ls-green); }

/* RIGHT COLUMN */
.right-col {
  width: 440px;
  background: var(--white);
  border-left: 1px solid var(--border);
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 20px;
  overflow-y: auto;
}

/* ORDER HEADER */
.order-title {
  font-size: 20px;
  font-weight: bold;
}

.order-meta {
  display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
}

.meta-badge {
  padding: 4px 10px;
  border-radius: 12px;
  font-size: 12px;
  font-weight: 600;
}
.meta-badge.art { background: #f1f5f9; color: var(--gray-text); }
.meta-badge.date { background: var(--orange-bg); color: #92400e; }
.meta-badge.status-ok { background: var(--green-badge-bg); color: #166534; }

/* SECTIONS */
.section { display: flex; flex-direction: column; gap: 8px; }
.section-label { font-size: 12px; font-weight: 600; color: var(--gray-text); }

.status-badge {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 14px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
}
.status-badge.active { background: var(--green-badge-bg); color: #166534; }
.status-badge.waiting { background: #f1f5f9; color: var(--gray-text); }
.status-badge.done { background: var(--green-badge-bg); color: #166534; }

.divider {
  height: 1px;
  background: var(--border);
}

/* ACTION SECTION */
.action-title { font-size: 16px; font-weight: bold; }
.action-subtitle { font-size: 13px; color: var(--gray-text); }

.action-btns {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.phase-btn {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 16px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  border: 1.5px solid;
  transition: opacity 0.2s;
  width: 100%;
  text-align: left;
}
.phase-btn:hover { opacity: 0.85; }

.phase-btn.laser { background: #fff7ed; border-color: var(--orange); color: var(--orange); }
.phase-btn.piega { background: #eff6ff; border-color: var(--blue); color: var(--blue); }
.phase-btn.saldatura { background: #faf5ff; border-color: var(--purple); color: var(--purple); }
.phase-btn.pulizia { background: #f0fdf4; border-color: var(--green-light); color: #166534; }
.phase-btn.finito {
  background: var(--ls-green); border-color: var(--ls-green); color: white;
  justify-content: center;
}

.phase-btn-label { flex: 1; }
.phase-btn-arrow { font-size: 16px; }

/* NOTE */
.note-input {
  width: 100%;
  height: 60px;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: 6px;
  font-size: 12px;
  font-family: 'Inter', sans-serif;
  resize: vertical;
  transition: border-color 0.2s;
}
.note-input:focus { outline: none; border-color: var(--ls-green); }

/* STORICO */
.storico-item {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 12px;
  border-radius: 6px;
  background: #f1f5f9;
  font-size: 12px;
}

.storico-icon { color: var(--ls-green); font-size: 14px; }

/* MESSAGE */
.message {
  position: fixed; bottom: 24px; left: 50%;
  transform: translateX(-50%) translateY(100px);
  padding: 12px 24px; border-radius: 8px;
  font-size: 13px; font-weight: 600; z-index: 3000;
  transition: transform 0.3s; pointer-events: none;
}
.message.active { transform: translateX(-50%) translateY(0); }
.message.success { background: var(--green-badge-bg); color: #166534; }
.message.error { background: #fee2e2; color: #991b1b; }

@media (max-width: 900px) {
  .main-area { flex-direction: column; height: auto; }
  .right-col { width: 100%; border-left: none; border-top: 1px solid var(--border); }
  .left-col { min-height: 50vh; }
}

  --blue: #1e40af;
  --blue-bg: #dbeafe;

  --red-bg: #fee2e2;

  --orange-bg: #fef3c7;
  --green-badge: #166534;
  --green-badge-bg: #dcfce7;
}

body {

  align-items: center;

}
.logo-icon img {
  width: 40px; height: 40px;
  object-fit: contain;
}

.logo-text { display: flex; flex-direction: column; gap: 1px; }
.logo-main { font-family: 'Geist', sans-serif; font-size: 16px; font-weight: 900; letter-spacing: -0.5px; color: var(--black); }
.logo-sub { font-size: 10px; font-weight: 600; letter-spacing: 1px; color: var(--green); }

.topbar-actions {
  display: flex;

  gap: 12px;
}

  border: none;

  font-family: 'Inter', sans-serif;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: opacity 0.2s;
}
.btn-home:hover { opacity: 0.9; }

.btn-logout {
  background: var(--white);
  color: var(--black);
  border: 1px solid var(--border);
  padding: 8px 16px;
  border-radius: 6px;
  font-family: 'Inter', sans-serif;
  font-size: 13px;
  cursor: pointer;
  transition: all 0.2s;
}
.btn-logout:hover { background: var(--bg); border-color: var(--gray-text); }

/* === TAB BAR === */
.tab-bar {
  position: fixed;
  top: 64px;
  left: 0; right: 0;
  display: flex;
  gap: 0;
  border-bottom: 2px solid var(--border);
  background: var(--white);
  padding: 0 48px;
  z-index: 999;
}

.tab-item {
  padding: 16px 24px;
  font-size: 14px;
  font-weight: 600;
  color: var(--gray-text);
  cursor: pointer;
  border-bottom: 3px solid transparent;
  transition: all 0.2s;
  margin-bottom: -2px;
  user-select: none;
}
.tab-item.active { color: var(--green); border-bottom-color: var(--green); }
.tab-item:hover:not(.active) { color: var(--black); background: rgba(26,122,72,0.03); }

/* === TAB PANELS === */
.tab-panel { display: none; margin-top: 120px; }
.tab-panel.active { display: block; }

/* === CARICA ORDINE TAB === */
.carica-body {
  display: flex;
  justify-content: center;
  padding: 48px 0;
  min-height: calc(100vh - 120px);
}

.form-card {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 36px;
  width: 700px;
  max-width: 95vw;
  box-shadow: 0 4px 16px rgba(0,0,0,0.08);
  display: flex;
  flex-direction: column;
  gap: 28px;
}

.form-title {
  font-family: 'Geist', sans-serif;
  font-size: 22px;
  font-weight: 900;
  letter-spacing: -0.5px;
  color: var(--black);
}

.form-sub {
  font-size: 14px;
  color: var(--gray-text);
  margin-top: -16px;
}

.form-row {
  display: flex;
  gap: 24px;
}

.form-group {
  display: flex;
  flex-direction: column;
  gap: 10px;
  flex: 1;
}

.form-label {
  font-size: 12px;
  font-weight: 600;
  color: var(--gray-text);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.form-input {
  border: 1px solid var(--border);
  padding: 0 12px;
  height: 40px;
  border-radius: 6px;
  font-size: 13px;
  font-family: 'Inter', sans-serif;
  color: var(--black);
  background: var(--white);
  transition: border 0.2s;
}
.form-input:focus { outline: none; border-color: var(--green); box-shadow: 0 0 0 3px rgba(26,122,72,0.1); }
textarea.form-input { resize: vertical; min-height: 80px; padding: 10px 12px; height: auto; font-size: 13px; line-height: 1.5; }

.upload-area {
  border: 2px dashed var(--border);
  border-radius: 8px;
  height: 180px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg);
  flex: 1;
}
.upload-area:hover { border-color: var(--green); background: rgba(26,122,72,0.02); }
.upload-area.active { border-color: var(--green); background: rgba(26,122,72,0.05); }

/* ===== MODERN UPLOAD BUTTONS ===== */
.upload-button-wrapper {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.upload-button {
  padding: 16px 24px;
  border: 2px solid;
  border-radius: 8px;
  background: var(--white);
  font-size: 15px;
  font-weight: 600;
  font-family: 'Inter', sans-serif;
  cursor: pointer;
  transition: all 0.2s ease;
  min-height: 48px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
}

/* PDF BUTTON */
.upload-button-pdf {
  border-color: var(--green);
  color: var(--green);
}

.upload-button-pdf:hover {
  background: var(--green);
  color: var(--white);
  box-shadow: 0 4px 12px rgba(26, 122, 72, 0.2);
}

.upload-button-pdf:active {
  transform: scale(0.98);
}

.upload-button-pdf:focus-visible {
  outline: 3px solid var(--green);
  outline-offset: 2px;
}

/* DXF BUTTON */
.upload-button-dxf {
  border-color: #3b82f6;
  color: #3b82f6;
}

.upload-button-dxf:hover {
  background: #3b82f6;
  color: var(--white);
  box-shadow: 0 4px 12px rgba(59, 130, 246, 0.2);
}

.upload-button-dxf:active {
  transform: scale(0.98);
}

.upload-button-dxf:focus-visible {
  outline: 3px solid #3b82f6;
  outline-offset: 2px;
}

/* UPLOAD STATUS MESSAGE */
.upload-status {
  font-size: 13px;
  padding: 10px 12px;
  border-radius: 6px;
  border: 1px solid;
  display: none;
  align-items: center;
  gap: 8px;
  animation: slideIn 0.3s ease;
}

.upload-status.success {
  display: flex;
  background: #dcfce7;
  color: #166534;
  border-color: #86efac;
}

.upload-status.error {
  display: flex;
  background: #fee2e2;
  color: #991b1b;
  border-color: #fca5a5;
}

.upload-status::before {
  content: '✓';
  font-weight: bold;
  font-size: 16px;
}

.upload-status.error::before {
  content: '⚠';
}

/* UPLOAD PROGRESS BAR */
.upload-progress {
  display: none;
  flex-direction: column;
  gap: 8px;
  animation: slideIn 0.3s ease;
}

.upload-progress.active {
  display: flex;
}

.progress-bar {
  height: 6px;
  background: #e5e5e5;
  border-radius: 3px;
  overflow: hidden;
  width: 100%;
}

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, #3b82f6, #1d4ed8);
  width: 0%;
  transition: width 0.2s ease;
  border-radius: 3px;
}

.progress-label {
  font-size: 12px;
  color: var(--gray-muted);
  text-align: center;
}

@keyframes slideIn {
  from {
    opacity: 0;
    transform: translateY(-4px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

#pdf-input, #dxf-input { display: none; }

.pdf-preview { border: 1px solid var(--border); border-radius: 8px; height: 200px; background: white; overflow: hidden; display: none; margin-top: 8px; }
.pdf-preview.active { display: block; }
.pdf-preview iframe { width: 100%; height: 100%; border: none; }

.dxf-files-list { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; max-height: 120px; overflow-y: auto; }
.dxf-item { background: var(--bg); padding: 8px 10px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; font-size: 12px; }
.dxf-remove-btn { background: #ef4444; color: white; border: none; padding: 3px 8px; border-radius: 4px; font-size: 11px; cursor: pointer; }

.dest-section { display: flex; flex-direction: column; gap: 8px; }
.dest-label { font-size: 11px; font-weight: 600; color: var(--gray-text); }
.dest-row { display: flex; gap: 12px; }

.dest-option {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  height: 56px;
  border: 2px solid var(--border);
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--white);
}
.dest-option input[type="radio"] { display: none; }
.dest-option .dest-text { font-size: 14px; font-weight: 700; }
.dest-option.selected-laser {
  border-color: var(--blue);
  background: var(--blue-bg);
}
.dest-option.selected-laser .dest-text { color: var(--blue); }
.dest-option.selected-officina {
  border-color: var(--gray-text);
  background: var(--bg);
}

.btn-submit {
  width: 100%;
  height: 48px;
  background: var(--green);
  color: var(--white);
  border: none;
  border-radius: 8px;
  font-family: 'Inter', sans-serif;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: opacity 0.2s;
}
.btn-submit:hover { opacity: 0.9; }
.btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }

.message { padding: 10px 14px; border-radius: 8px; font-size: 13px; display: none; }
.message.active { display: block; }
.message.success { background: rgba(34,197,94,0.1); color: #15803d; }
.message.error { background: rgba(239,68,68,0.1); color: #991b1b; }

/* === CALENDARIO TAB === */
.cal-container { display: flex; height: calc(100vh - 120px); }

.cal-left {
  flex: 1;
  display: flex;
  flex-direction: column;
  padding: 24px 32px;
  gap: 16px;
}

.cal-right {
  width: 380px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  padding: 24px;
  overflow-y: auto;
  background: var(--white);
  border-left: 1px solid var(--border);
}

.cal-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.cal-nav-btns { display: flex; gap: 8px; }

.cal-nav-btn {
  background: var(--white);
  border: 1px solid var(--border);
  padding: 8px 14px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
  font-family: 'Inter', sans-serif;
  transition: all 0.2s;
}
.cal-nav-btn:hover { background: var(--bg); border-color: var(--green); }

.cal-today-btn {
  background: var(--green);
  color: var(--white);
  border: none;
  padding: 8px 14px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
  font-family: 'Inter', sans-serif;
}
.cal-today-btn:hover { opacity: 0.9; }

.cal-nav-title { font-size: 20px; font-weight: 700; }

.cal-grid {
  display: flex;
  flex-direction: column;
  gap: 4px;
  flex: 1;
}

.cal-header-row {
  display: flex;
  gap: 4px;
}

.cal-header {
  flex: 1;
  text-align: center;
  font-size: 11px;
  font-weight: 700;
  color: var(--gray-text);
  padding: 6px 0;
  text-transform: uppercase;
}

.cal-week-row {
  display: flex;
  gap: 4px;
  flex: 1;
}

.cal-day {
  flex: 1;
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 6px 8px;
  min-height: 70px;
  cursor: pointer;
  transition: all 0.15s;
  display: flex;
  flex-direction: column;
}
.cal-day:hover { border-color: var(--green); box-shadow: 0 2px 6px rgba(26,122,72,0.1); }
.cal-day.today { border: 2px solid var(--green); background: rgba(26,122,72,0.06); }
.cal-day.selected { border: 2px solid var(--green); background: rgba(26,122,72,0.08); }
.cal-day.other-month { opacity: 0.35; }

.cal-day-num { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
.cal-day-count { font-size: 10px; font-weight: 700; color: var(--green); }
.cal-dots { display: flex; gap: 3px; flex-wrap: wrap; margin-top: auto; }
.cal-dot { width: 6px; height: 6px; border-radius: 50%; }

.cal-detail-title { font-size: 18px; font-weight: 700; }
.cal-detail-sub { font-size: 13px; color: var(--gray-text); }

.cal-order-card {
  padding: 14px;
  background: var(--white);
  border: 1px solid var(--border);
  border-left: 4px solid #3b82f6;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.15s;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.cal-order-card:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.08); transform: translateY(-1px); }

.progress-bar-bg { height: 6px; background: #e5e5e5; border-radius: 3px; overflow: hidden; }
.progress-bar-fill { height: 100%; border-radius: 3px; transition: width 0.4s ease; }

/* === ORDINI TAB === */
.ordini-container { padding: 32px 48px; max-width: 1400px; margin: 0 auto; }
.page-title { font-family: 'Geist', sans-serif; font-size: 22px; font-weight: 900; letter-spacing: -0.5px; margin-bottom: 24px; }

.search-wrap { position: relative; margin-bottom: 16px; }
.search-icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); font-size: 16px; color: var(--gray-text); }
.search-box {
  width: 100%;
  padding: 14px 16px 14px 44px;
  border: 1px solid var(--border);
  border-radius: 10px;
  font-size: 14px;
  font-family: 'Inter', sans-serif;
  background: var(--white);
  transition: border 0.2s;
}
.search-box:focus { outline: none; border-color: var(--green); box-shadow: 0 0 0 3px rgba(26,122,72,0.1); }

.filter-row { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; align-items: center; }
.filter-label { font-size: 12px; font-weight: 700; color: var(--gray-text); margin-right: 4px; text-transform: uppercase; }

.chip {
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 600;
  border: 1px solid var(--border);
  background: var(--white);
  cursor: pointer;
  transition: all 0.2s;
  font-family: 'Inter', sans-serif;
}
.chip.active { background: var(--green); color: white; border-color: var(--green); }
.chip:hover:not(.active) { background: var(--bg); border-color: var(--green); }

.ordini-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
}
.ordini-table thead { background: #f1f5f9; }
.ordini-table th {
  text-align: left;
  padding: 12px 14px;
  font-size: 11px;
  font-weight: 700;
  color: var(--gray-text);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  cursor: pointer;
  user-select: none;
}
.ordini-table th:hover { color: var(--green); }
.ordini-table td { padding: 12px 14px; border-top: 1px solid var(--border); }
.ordini-table tbody tr { transition: background 0.15s; }
.ordini-table tbody tr:hover { background: rgba(26,122,72,0.02); }

.fase-badge {
  display: inline-block;
  padding: 3px 8px;
  border-radius: 12px;
  font-size: 10px;
  font-weight: 700;
  color: white;
}

.pdf-btn {
  background: var(--bg);
  border: 1px solid var(--border);
  padding: 5px 10px;
  border-radius: 4px;
  cursor: pointer;
  font-size: 12px;
  transition: all 0.2s;
}
.pdf-btn:hover { border-color: var(--green); color: var(--green); }

/* === PDF MODALE === */
.modal-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.5);
  z-index: 2000;
  align-items: center;
  justify-content: center;
}
.modal-overlay.active { display: flex; }
.modal-content {
  background: var(--white);
  width: 80%;
  height: 85%;
  border-radius: 12px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px 24px;
  border-bottom: 1px solid var(--border);
}
.modal-header h3 { font-size: 16px; font-weight: 700; }
.modal-close { background: none; border: none; font-size: 24px; cursor: pointer; color: var(--gray-text); }
.modal-body { flex: 1; }
.modal-body iframe { width: 100%; height: 100%; border: none; }

/* === RESPONSIVE === */
@media (max-width: 1024px) {
  .cal-container { flex-direction: column; height: auto; }
  .cal-right { width: 100%; border-left: none; border-top: 1px solid var(--border); }
  .topbar, .tab-bar { padding: 0 24px; }
  .ordini-container { padding: 24px; }
  .form-row { flex-direction: column; }
  .form-card { width: 95vw; }
}

/* === FASI TABLE === */
.fasi-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
  margin-top: 8px;
}

.fasi-table thead tr {
  background: var(--bg);
}

.fasi-table th {
  padding: 8px 10px;
  text-align: left;
  font-weight: 700;
  font-size: 11px;
  color: var(--gray-text);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.fasi-table tbody tr {
  border-top: 1px solid var(--border);
}

.fasi-table tbody tr.current-fase {
  background: rgba(26, 122, 72, 0.03);
}

.fasi-table td {
  padding: 10px;
  color: var(--black);
}

.fase-badge-table {
  font-size: 10px;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 10px;
  display: inline-block;
}

.fase-badge-table.LASER {
  background: #dbeafe;
  color: #1e40af;
}

.fase-badge-table.PIEGA {
  background: #fef3c7;
  color: #92400e;
}

.fase-badge-table.SALDATURA {
  background: #fee2e2;
  color: #991b1b;
}

.fase-badge-table.PULIZIA {
  background: #f3e8ff;
  color: #6b21a8;
}

.current-fase-marker {
  font-size: 10px;
  color: var(--ls-green);
  font-weight: 600;
  margin-left: 6px;
}

/* === EDIT FORM === */
.section-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  cursor: pointer;
  user-select: none;
}

.section-header:hover {
  color: var(--ls-green);
}

#edit-toggle-icon {
  font-size: 12px;
  color: var(--gray-text);
  transition: transform 0.2s;
}

#edit-form {
  display: none;
  flex-direction: column;
  gap: 16px;
  margin-top: 16px;
}

#edit-form.visible {
  display: flex;
}

.form-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.form-label {
  font-size: 12px;
  font-weight: 700;
  color: var(--black);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.form-input {
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 10px 12px;
  font-size: 13px;
  font-family: 'Inter', sans-serif;
  transition: border-color 0.2s;
}

.form-input:focus {
  outline: none;
  border-color: var(--ls-green);
}

.form-input.textarea {
  height: auto;
  padding: 10px 12px;
  resize: vertical;
  min-height: 80px;
}
</style>
</head>
<body>

<div class="topbar">
  <a class="logo-section" href="/login.html">
    <div class="logo-icon"><img src="/assets/logo.svg" alt="LS"></div>
    <div class="logo-text">
      <div class="logo-main">FerroTrack</div>
      <div class="logo-sub">LS</div>
    </div>
  </a>
  <div class="topbar-actions">
    <button class="btn-home" onclick="goHome()">Home</button>
    <button class="btn-logout" onclick="logout()">Esci</button>
  </div>
</div>

<div class="main-area">
  <!-- LEFT: PDF + DXF -->
  <div class="left-col">
    <a class="back-link" id="back-link" href="/officina.html">&larr; Torna alla lista</a>

    <div class="pdf-viewer">
      <div class="pdf-info">
        <span id="pdf-label">PDF Ordine</span>
      </div>
      <div class="pdf-info pdf-info-sub" id="pdf-sub"></div>
      <iframe class="pdf-iframe" id="pdf-iframe"></iframe>
    </div>

    <div class="dxf-row" id="dxf-row"></div>
  </div>

  <!-- RIGHT: DETAILS -->
  <div class="right-col" id="right-col">
    <div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--gray-text);">Caricamento...</div>
  </div>
</div>

<div class="message" id="status-message"></div>

<script>
const API_URL = '';
let currentUser = null;
let order = null;

// === SESSION & INIT ===
window.addEventListener('load', () => {
  const saved = localStorage.getItem('currentUser');
  if (!saved) { window.location.href = '/login.html'; return; }
  currentUser = JSON.parse(saved);
  if (!currentUser.id) { window.location.href = '/login.html'; return; }

  // Set back link based on user role/phase
  const backLink = document.getElementById('back-link');
  if (currentUser.role === 'Impiegata') {
    backLink.href = '/impiegata.html';
  } else if (currentUser.phase === 'LASER') {
    backLink.href = '/laser-v2.html';
  } else {
    backLink.href = '/officina.html';
  }

  const params = new URLSearchParams(window.location.search);
  const orderId = params.get('id');
  if (!orderId) {
    document.getElementById('right-col').innerHTML = '<div style="padding:40px;color:var(--gray-text);text-align:center;">Nessun ordine specificato</div>';
    return;
  }

  loadOrder(orderId);
});

// === LOAD ORDER ===
async function loadOrder(orderId) {
  try {
    const resp = await fetch(`${API_URL}/api/orders/${orderId}`);
    order = await resp.json();
    renderLeft();
    renderRight();
  } catch (err) {
    console.error('Errore caricamento ordine:', err);
    document.getElementById('right-col').innerHTML = '<div style="padding:40px;color:var(--gray-text);text-align:center;">Errore caricamento ordine</div>';
  }
}

// === RENDER LEFT ===
function renderLeft() {
  const consegna = order.data_consegna ? new Date(order.data_consegna).toLocaleDateString('it-IT') : 'N/A';
  document.getElementById('pdf-label').textContent = `PDF Ordine - ${escapeHtml(order.numero_ordine || order.id?.substring(0, 8))}`;
  document.getElementById('pdf-sub').textContent = `${escapeHtml(order.cliente)} \u2014 Scadenza: ${consegna}`;
  document.getElementById('pdf-iframe').src = `${API_URL}/api/orders/${order.id}/pdf`;

  // DXF files
  const dxfFiles = order.dxf_files || [];
  const dxfRow = document.getElementById('dxf-row');
  if (dxfFiles.length > 0) {
    dxfRow.innerHTML = dxfFiles.map(f =>
      `<a class="dxf-btn" href="${API_URL}/api/orders/${order.id}/dxf/${encodeURIComponent(f.filename)}" target="_blank">&#128196; ${escapeHtml(f.filename)}</a>`
    ).join('');
  }
}

// === RENDER RIGHT ===
function renderRight() {
  const panel = document.getElementById('right-col');
  const consegna = order.data_consegna ? new Date(order.data_consegna).toLocaleDateString('it-IT') : 'N/A';
  const articles = order.articles || [];
  const steps = order.processing_steps || [];

  // Current status
  const phase = order.fase_corrente;
  const activeStep = steps.find(s => s.timestamp_inizio && !s.timestamp_fine);
  let statusText = 'Ricevuto';
  let statusClass = 'waiting';
  if (activeStep) { statusText = `In lavorazione: ${activeStep.fase}`; statusClass = 'active'; }
  else if (order.status === 'COMPLETATO') { statusText = 'Completato'; statusClass = 'done'; }
  else if (phase && phase !== 'COMPLETATO') { statusText = `In attesa fase: ${phase}`; statusClass = 'waiting'; }

  let html = `
    <!-- Order Header -->
    <div class="section" style="gap:6px;">
      <div class="order-title">${escapeHtml(order.numero_ordine || order.id?.substring(0, 8))} &mdash; ${escapeHtml(order.cliente)}</div>
      <div class="order-meta">
        <span class="meta-badge art">${articles.length} articoli</span>
        <span class="meta-badge date">Consegna: ${consegna}</span>
      </div>
    </div>

    <!-- Status -->
    <div class="section">
      <div class="section-label">Stato attuale</div>
      <div><span class="status-badge ${statusClass}">${statusText}</span></div>
    </div>

    <div class="divider"></div>

    <!-- Actions -->
    <div class="section" style="gap:12px;">
      <div class="action-title">Cosa vuoi fare?</div>
      <div class="action-subtitle">Scegli la prossima azione per questo ordine</div>
      <div class="action-btns">
        ${!activeStep && order.status !== 'COMPLETATO' ? `
          <button class="phase-btn laser" onclick="moveToPhase('LASER')">
            <span>&#9889;</span>
            <span class="phase-btn-label">Manda al Laser</span>
            <span class="phase-btn-arrow">&rarr;</span>
          </button>
          <button class="phase-btn piega" onclick="moveToPhase('PIEGA')">
            <span>&#9881;</span>
            <span class="phase-btn-label">Manda alla Piega</span>
            <span class="phase-btn-arrow">&rarr;</span>
          </button>
          <button class="phase-btn saldatura" onclick="moveToPhase('SALDATURA')">
            <span>&#128293;</span>
            <span class="phase-btn-label">Manda alla Saldatura</span>
            <span class="phase-btn-arrow">&rarr;</span>
          </button>
          <button class="phase-btn pulizia" onclick="moveToPhase('PULIZIA')">
            <span>&#10024;</span>
            <span class="phase-btn-label">Manda alla Pulizia</span>
            <span class="phase-btn-arrow">&rarr;</span>
          </button>
          <button class="phase-btn finito" onclick="markComplete()">
            <span>&#10004;</span>
            <span>Segna come Finito</span>
          </button>
        ` : activeStep ? `
          <button class="phase-btn finito" onclick="completeCurrentPhase()">
            <span>&#10004;</span>
            <span>Completa fase ${activeStep.fase}</span>
          </button>
        ` : `
          <div style="padding:16px;background:var(--green-badge-bg);border-radius:8px;text-align:center;color:#166534;font-weight:600;">Ordine completato</div>
        `}
      </div>
    </div>

    <div class="divider"></div>

    <!-- Fasi di Lavorazione -->
    <div class="section">
      <div class="section-label">Fasi di Lavorazione</div>
      <table class="fasi-table">
        <thead>
          <tr>
            <th>Fase</th>
            <th>Operatore</th>
            <th>Stato</th>
            <th>Data</th>
          </tr>
        </thead>
        <tbody id="fasi-table-body">
          ${['LASER', 'PIEGA', 'SALDATURA', 'PULIZIA'].map(p => {
            const step = steps.find(s => s.fase === p);
            let stato = 'In attesa';
            let statoColor = 'var(--gray-muted)';
            let statoBg = 'var(--bg)';
            let dateStr = '—';
            let operator = '—';

            if (step) {
              operator = step.operatore || '—';
              if (step.timestamp_fine) {
                stato = 'Completata'; statoColor = '#166534'; statoBg = 'var(--green-badge-bg)';
                dateStr = new Date(step.timestamp_fine).toLocaleDateString('it-IT');
              } else if (step.timestamp_inizio) {
                stato = 'In corso'; statoColor = 'var(--blue)'; statoBg = 'var(--blue-bg)';
                dateStr = new Date(step.timestamp_inizio).toLocaleDateString('it-IT');
              }
            }

            const isCurrent = order.fase_corrente === p;
            const bgColor = isCurrent ? 'rgba(26,122,72,0.03)' : 'transparent';
            return `<tr style="background:${bgColor};">
              <td>
                <span class="fase-badge-table ${p}">${p}</span>
                ${isCurrent ? '<span class="current-fase-marker">← Attuale</span>' : ''}
              </td>
              <td style="font-size:12px;">${escapeHtml(operator)}</td>
              <td><span style="font-size:11px; font-weight:600; padding:2px 8px; border-radius:10px; background:${statoBg}; color:${statoColor};">${stato}</span></td>
              <td style="font-size:12px; color:var(--gray-text);">${dateStr}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>

    <div class="divider"></div>

    <!-- Notes -->
    <div class="section">
      <div class="section-label">Note (opzionale)</div>
      <textarea class="note-input" id="note-input" placeholder="Aggiungi note per questo ordine...">${escapeHtml(order.note || '')}</textarea>
    </div>

    <!-- Edit Form (visible only to capo/admin) -->
    ${currentUser.is_capo || currentUser.role === 'Amministratore' ? `
    <div class="divider"></div>

    <div class="section">
      <div class="section-header" onclick="toggleEditForm()">
        <span style="font-weight:700;">Modifica Ordine</span>
        <span id="edit-toggle-icon">▸</span>
      </div>
      <div id="edit-form">
        <div class="form-group">
          <label class="form-label">Cliente</label>
          <input class="form-input" type="text" id="det-edit-cliente" placeholder="Nome cliente" value="${escapeHtml(order.cliente || '')}">
        </div>
        <div class="form-group">
          <label class="form-label">N° Ordine</label>
          <input class="form-input" type="text" id="det-edit-numero" placeholder="Es. 2024-001" value="${escapeHtml(order.numero_ordine || '')}">
        </div>
        <div class="form-group">
          <label class="form-label">Data Consegna</label>
          <input class="form-input" type="date" id="det-edit-data" value="${order.data_consegna ? order.data_consegna.split('T')[0] : ''}">
        </div>
        <div class="form-group">
          <label class="form-label">Note</label>
          <textarea class="form-input textarea" id="det-edit-note" placeholder="Note aggiuntive...">${escapeHtml(order.note || '')}</textarea>
        </div>
        <button class="phase-btn finito" onclick="saveDetEdit()" style="width:100%; height:44px;">Salva Modifiche</button>
      </div>
    </div>
    ` : ''}

    <!-- History -->
    <div class="section">
      <div class="section-label">Storico fasi</div>
      ${steps.length > 0 ? steps.map(s => {
        const done = s.timestamp_fine;
        const dateStr = done
          ? new Date(s.timestamp_fine).toLocaleDateString('it-IT') + ' ore ' + new Date(s.timestamp_fine).toLocaleTimeString('it-IT', {hour:'2-digit', minute:'2-digit'})
          : s.timestamp_inizio
            ? 'iniziato ' + new Date(s.timestamp_inizio).toLocaleDateString('it-IT')
            : '';
        const icon = done ? '&#10004;' : '&#9679;';
        return `<div class="storico-item">
          <span class="storico-icon">${icon}</span>
          <span>${s.fase} &mdash; ${done ? 'completato' : 'in corso'} ${dateStr}${s.operatore ? ' (' + escapeHtml(s.operatore) + ')' : ''}</span>
        </div>`;
      }).join('') : '<div style="font-size:12px;color:var(--gray-text);">Nessuna fase registrata</div>'}
    </div>
  `;

  panel.innerHTML = html;
}

// === ACTIONS ===
async function moveToPhase(newPhase) {
  try {
    const resp = await fetch(`${API_URL}/api/orders/${order.id}/move-phase`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ new_phase: newPhase, capo_id: currentUser.id })
    });
    const result = await resp.json();
    if (result.success) {
      showMessage(`Ordine spostato a ${newPhase}`, 'success');
      await loadOrder(order.id);
    } else {
      showMessage('Errore: ' + (result.error || 'Impossibile spostare'), 'error');
    }
  } catch (err) {
    showMessage('Errore di connessione', 'error');
  }
}

async function completeCurrentPhase() {
  const step = (order.processing_steps || []).find(s => s.timestamp_inizio && !s.timestamp_fine);
  if (!step) return;

  const note = document.getElementById('note-input')?.value || '';
  try {
    const resp = await fetch(`${API_URL}/api/orders/${order.id}/phase/${step.fase}/complete`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ operatore_id: currentUser.id, note })
    });
    const result = await resp.json();
    if (result.success) {
      showMessage('Fase completata!', 'success');
      await loadOrder(order.id);
    } else {
      showMessage('Errore: ' + (result.error || 'Impossibile completare'), 'error');
    }
  } catch (err) {
    showMessage('Errore di connessione', 'error');
  }
}

async function markComplete() {
  try {
    const resp = await fetch(`${API_URL}/api/orders/${order.id}/phase/COMPLETATO/complete`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ operatore_id: currentUser.id })
    });
    const result = await resp.json();
    if (result.success) {
      showMessage('Ordine completato!', 'success');
      await loadOrder(order.id);
    } else {
      showMessage('Errore: ' + (result.error || 'Impossibile completare'), 'error');
    }
  } catch (err) {
    showMessage('Errore di connessione', 'error');
  }
}

// === EDIT FORM ===
function toggleEditForm() {
  const form = document.getElementById('edit-form');
  const icon = document.getElementById('edit-toggle-icon');
  if (form) {
    form.classList.toggle('visible');
    if (icon) {
      icon.textContent = form.classList.contains('visible') ? '▾' : '▸';
    }
  }
}

async function saveDetEdit() {
  if (!order || !order.id) return;
  const payload = {
    cliente: document.getElementById('det-edit-cliente').value.trim(),
    numero_ordine: document.getElementById('det-edit-numero').value.trim(),
    data_consegna: document.getElementById('det-edit-data').value,
    note: document.getElementById('det-edit-note').value.trim()
  };
  try {
    const resp = await fetch(`${API_URL}/api/orders/${order.id}`, {
      method: 'PUT',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload)
    });
    const result = await resp.json();
    if (result.success) {
      showMessage('Ordine aggiornato con successo', 'success');
      await loadOrder(order.id);
    } else {
      showMessage('Errore: ' + result.error, 'error');
    }
  } catch (e) {
    showMessage('Errore di connessione', 'error');
  }
}

// === UTILS ===
function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function showMessage(text, type) {
  const msg = document.getElementById('status-message');
  msg.textContent = text;
  msg.className = 'message active ' + type;
  setTimeout(() => msg.classList.remove('active'), 4000);
}

function goHome() {
  const u = JSON.parse(localStorage.getItem('currentUser') || '{}');
  if (!u.id) { window.location.href = '/login.html'; return; }
  if (u.role === 'Impiegata') { window.location.href = '/impiegata.html'; return; }
  if (u.phase === 'LASER') { window.location.href = '/laser-v2.html'; return; }
  window.location.href = '/officina.html';
}

async function logout() {
  try {
    if (currentUser?.id) {
      await fetch(`${API_URL}/api/auth/logout`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ user_id: currentUser.id })
      });
    }
  } catch (_) {}
  localStorage.removeItem('currentUser');
  window.location.href = '/login.html';
}

// === SMOOTH PAGE TRANSITIONS ===
document.addEventListener('click', (e) => {
  const link = e.target.closest('a[href]');
  if (!link) return;
  const href = link.getAttribute('href');
  if (!href || href.startsWith('#') || href.startsWith('javascript') || link.target === '_blank') return;
  if (href === window.location.pathname) return;
  e.preventDefault();
  document.body.classList.add('page-exit');
  setTimeout(() => { window.location.href = href; }, 150);
});
</script>
